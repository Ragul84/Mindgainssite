<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Get early access — MindGains</title>
  <meta name="description" content="Join the MindGains Android early-access list. Tell us your exam and we'll let you in as spots open.">
  <link rel="canonical" href="https://mindgains.ai/get/">
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/icons/favicon-32.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <meta name="theme-color" content="#00d4c7">
  <style>
    :root{
      --teal:#00d4c7;--teal-deep:#0ba79e;--teal-ink:#087c75;
      --ink:#0f172a;--muted:#5b6b7f;--faint:#8a99ab;
      --paper:#f6faf9;--white:#fff;--line:rgba(15,23,42,.09);--line-soft:rgba(15,23,42,.06);
      --shadow:0 1px 2px rgba(15,23,42,.05),0 14px 40px rgba(15,23,42,.07);
    }
    *{box-sizing:border-box}
    html{-webkit-text-size-adjust:100%}
    body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
    a{color:inherit;text-decoration:none}
    .nav{border-bottom:1px solid var(--line-soft);background:var(--white)}
    .navin{width:min(1120px,calc(100% - 40px));margin:0 auto;height:66px;display:flex;align-items:center;justify-content:space-between}
    .brand{font:800 19px/1 Poppins,sans-serif;letter-spacing:-.5px;display:flex;align-items:center;gap:9px}
    .brand i{width:26px;height:26px;border-radius:8px;background:linear-gradient(135deg,var(--teal),#4aded9);position:relative}
    .brand i:after{content:'✦';position:absolute;inset:0;display:grid;place-items:center;color:#fff;font-style:normal;font-size:14px}
    .back{color:#42536a;font-weight:600;font-size:14px}
    .back:hover{color:var(--teal-ink)}
    main{min-height:calc(100vh - 66px);display:grid;place-items:center;padding:46px 20px}
    .card{width:min(500px,100%);background:var(--white);border:1px solid var(--line);border-radius:28px;padding:34px;box-shadow:var(--shadow)}
    .badge{width:58px;height:58px;border-radius:18px;background:#e6faf8;display:grid;place-items:center;margin:0 auto}
    .badge img{width:42px;height:42px;border-radius:13px}
    .eyebrow{display:block;text-align:center;margin:16px 0 6px;color:var(--teal-ink);font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase}
    h1{text-align:center;font:800 32px/1.12 Poppins,sans-serif;letter-spacing:-.02em;margin:0}
    .sub{text-align:center;color:var(--muted);margin:10px auto 0;max-width:36ch;font-size:15px}
    .chips{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:20px 0 4px}
    .chips span{padding:7px 11px;border-radius:999px;background:#f1fbfa;color:var(--teal-ink);font-size:12px;font-weight:700}
    .fg{margin-top:16px}
    .fg label{display:block;margin-bottom:6px;color:var(--teal-ink);font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase}
    .fg input,.fg select{width:100%;height:52px;border:1px solid #d7e3e1;border-radius:14px;background:#fff;padding:0 15px;font:600 15px Inter;color:var(--ink)}
    .fg input:focus,.fg select:focus{outline:none;border-color:var(--teal-deep);box-shadow:0 0 0 3px rgba(0,212,199,.15)}
    .submit{width:100%;height:54px;margin-top:22px;border:0;border-radius:999px;background:var(--teal-deep);color:#fff;font:800 15px Inter;box-shadow:0 5px 0 var(--teal-ink);cursor:pointer}
    .submit:active{transform:translateY(3px);box-shadow:0 2px 0 var(--teal-ink)}
    .submit:disabled{opacity:.7;cursor:default}
    .success{display:none;margin-top:18px;padding:22px;border-radius:18px;background:#e5faf7;text-align:center}
    .success .em{font-size:34px;margin-bottom:8px}
    .success strong{display:block;font:800 17px Poppins,sans-serif;margin-bottom:6px}
    .success p{margin:0;color:var(--muted);font-size:14px;line-height:1.6}
    .fine{text-align:center;font-size:12px;color:var(--faint);margin:16px 0 0}
    :focus-visible{outline:2px solid var(--teal-deep);outline-offset:2px;border-radius:4px}
  </style>
</head>
<body>
<header class="nav">
  <div class="navin">
    <a class="brand" href="/"><i aria-hidden="true"></i>MindGains</a>
    <a class="back" href="/">← Back to site</a>
  </div>
</header>
<main>
  <section class="card">
    <div class="badge"><img src="/assets/icons/mindgains-logo-192.png" alt="MindGains"></div>
    <span class="eyebrow">Android · Private beta</span>
    <h1>Get early access.</h1>
    <p class="sub">Tell us your exam and we'll let you in as spots open — with your Daily Dose already set up.</p>
    <div class="chips"><span>Daily Dose</span><span>Verified PYQs</span><span>Call Miga</span><span>State League</span></div>

    <form id="get-form" onsubmit="submitEarlyAccess(event)">
      <div class="fg">
        <label for="email">Email address</label>
        <input type="email" id="email" autocomplete="email" placeholder="you@example.com" required>
      </div>
      <div class="fg">
        <label for="exam">Which exam are you preparing for?</label>
        <select id="exam">
          <option value="upsc">UPSC — Civil Services</option>
          <option value="tnpsc" selected>TNPSC — Group 1, 2, 4</option>
          <option value="ssc">SSC — CGL, CHSL, MTS, GD</option>
          <option value="rrb">RRB / Railway — NTPC, Group D</option>
          <option value="ncert">NCERT Foundation — Class 6–12</option>
          <option value="samacheer">Samacheer Kalvi — TN Board</option>
          <option value="other">Other competitive exam</option>
        </select>
      </div>
      <div class="fg">
        <label for="state">Your state <span style="text-transform:none;font-weight:600;color:var(--faint)">(optional — for the State League)</span></label>
        <input type="text" id="state" autocomplete="address-level1" placeholder="e.g. Tamil Nadu">
      </div>
      <button type="submit" class="submit" id="sub-btn">Join early access</button>
    </form>

    <div class="success" id="success-box"></div>
    <p class="fine">Free while in beta. We'll only email you about access.</p>
  </section>
</main>

<script>
  const SUPABASE_URL = 'https://yuntwerxahgmaoduxvqc.supabase.co/rest/v1/waitlist';
  const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl1bnR3ZXJ4YWhnbWFvZHV4dnFjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTU3OTk4OTMsImV4cCI6MjA3MTM3NTg5M30.1mFUH9yp55uxN8n9tyRHLFbve36_kpaJs41nPU85S74';

  function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

  async function submitEarlyAccess(e){
    e.preventDefault();
    const email = document.getElementById('email').value.trim();
    const exam  = document.getElementById('exam').value;
    const state = document.getElementById('state').value.trim();
    const btn   = document.getElementById('sub-btn');
    if(!email) return;

    btn.disabled = true;
    btn.textContent = 'Adding you…';

    let status = 0;
    try{
      const res = await fetch(SUPABASE_URL, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'apikey': SUPABASE_KEY,
          'Prefer': 'return=minimal'
        },
        body: JSON.stringify({ email, source: 'get-early-access', language: exam, state: state || null })
      });
      status = res.status;
    }catch(err){
      status = -1;
    }

    document.getElementById('get-form').style.display = 'none';
    const box = document.getElementById('success-box');
    box.style.display = 'block';

    if(status === 201){
      box.innerHTML = '<div class="em">🎉</div><strong>You\'re on the list</strong><p>We saved <b>'+esc(email)+'</b> for <b>'+esc(exam.toUpperCase())+'</b>. We\'ll email you the moment your beta access opens.</p>';
    } else if(status === 409){
      box.innerHTML = '<div class="em">✨</div><strong>Already on the list</strong><p><b>'+esc(email)+'</b> is already registered. Your early access is secured — sit tight.</p>';
    } else if(status === -1){
      document.getElementById('get-form').style.display = '';
      box.style.display = 'none';
      btn.disabled = false;
      btn.textContent = 'Join early access';
      alert('Network hiccup — please try again in a moment.');
    } else {
      box.innerHTML = '<div class="em">✅</div><strong>Request received</strong><p>We\'ve noted <b>'+esc(email)+'</b> for <b>'+esc(exam.toUpperCase())+'</b>. We\'ll be in touch about beta access.</p>';
    }
  }
</script>
</body>
</html>
