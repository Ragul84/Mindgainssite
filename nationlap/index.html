<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <!-- viewport-fit=cover so the game reaches under notches; no user zoom, since pinch/double-tap
       zoom fights the drag-to-steer control and there's nothing to zoom into -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#0b1020" />
  <title>NationLap · MindGains</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />

  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏁</text></svg>" />

       kept serving stale JS/CSS after edits. Bump ?v= (same value everywhere, incl. the import map
       below, which re-points every src/ module import) whenever you change src/ files. -->
  <link rel="stylesheet" href="src/styles.css?v=20261106-family" />
  <script type="importmap">

      "./src/ai.js": "./src/ai.js?v=20261106-family",

      "./src/lb.js": "./src/lb.js?v=20261106-family",
