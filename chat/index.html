    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {

      --accent-bg: rgba(123,227,176,0.12);
      --accent-border: rgba(123,227,176,0.3);
      --bg: #08080C;

      color: var(--text);

    .nav-header-center { display: flex; align-items: center; justify-content: center; }

    .mode-tab { padding: 4px 12px; border-radius: 999px; font-size: 11px; font-weight: 600; color: rgba(255,255,255,0.55); background: transparent; border: none; cursor: pointer; transition: all 0.18s; display: flex; align-items: center; gap: 4px; font-family: 'Inter', sans-serif; }
    .mode-tab.active { background: #FFFFFF; color: #000000; font-weight: 700; box-shadow: 0 2px 8px rgba(255,255,255,0.2); }

    .nav-header-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
    .exit-btn { width: 28px; height: 28px; border-radius: 50%; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12); color: rgba(255,255,255,0.8); display: flex; align-items: center; justify-content: center; text-decoration: none; transition: all 0.18s; }
    .exit-btn:hover { background: rgba(255,255,255,0.14); color: #fff; transform: scale(1.05); }

    /* === CHAT THREAD === */
    #thread {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 16px clamp(12px, 3vw, 36px);
      display: flex;
      flex-direction: column;
      gap: 16px;
      scroll-behavior: smooth;
      max-width: 860px;
      width: 100%;
      margin: 0 auto;
    }

    /* === EMPTY STATE & PROMPT CARDS === */
    .empty-state { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; text-align: center; padding: 16px 12px; margin: auto 0; }
    .empty-title { font-size: 22px; font-weight: 700; margin-bottom: 20px; color: #ffffff; letter-spacing: -0.02em; }

    .empty-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; max-width: 780px; width: 100%; }
    .prompt-card { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-radius: 14px; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.07); text-align: left; cursor: pointer; transition: all 0.18s cubic-bezier(0.16, 1, 0.3, 1); color: inherit; font-family: 'Inter', sans-serif; }

    .prompt-card-text span { display: block; font-size: 11px; color: rgba(255,255,255,0.5); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .prompt-card-arrow { font-size: 15px; color: rgba(255,255,255,0.25); transition: all 0.18s; flex-shrink: 0; }
    .prompt-card:hover .prompt-card-arrow { color: var(--accent); transform: translateX(3px); }

    .msg-row.user-row { flex-direction: row-reverse; margin-left: auto; max-width: 86%; }
    .av { width: 28px; height: 28px; border-radius: 8px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; margin-top: 2px; }
    .av.ai { background: transparent; border-radius: 8px; overflow: hidden; }

    .av.user { background: rgba(255,255,255,0.12); color: rgba(255,255,255,0.85); border-radius: 50%; overflow: hidden; }
    .av.user img { width: 28px; height: 28px; border-radius: 50%; object-fit: cover; }

    .bubble { max-width: 88%; padding: 12px 16px; font-size: 14px; line-height: 1.58; font-family: 'Inter', sans-serif; }
    .ai-bub { background: rgba(18, 22, 32, 0.88); border: 1px solid rgba(255,255,255,0.08); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-radius: 4px 16px 16px 16px; color: rgba(255,255,255,0.94); box-shadow: 0 4px 20px rgba(0,0,0,0.3); }

    @keyframes waveDot {

    .typing-dot { width: 6px; height: 6px; border-radius: 50%; animation: waveDot 1.2s ease-in-out infinite; }
    .typing-dot:nth-child(1) { background: #7BE3B0; animation-delay: 0ms; }
    .typing-dot:nth-child(2) { background: #38bdf8; animation-delay: 180ms; }
    .typing-dot:nth-child(3) { background: #34d399; animation-delay: 360ms; }
    .typing-label { font-size: 12px; font-weight: 600; color: rgba(255,255,255,0.65); letter-spacing: 0.02em; animation: pulseThinkingText 1.6s ease-in-out infinite alternate; }

    /* === MODERN HIGH-END INPUT CAPSULE === */
    .cinput-wrap {
      padding: 12px 16px max(16px, env(safe-area-inset-bottom, 16px));
      background: rgba(10, 12, 18, 0.96);

    .cinput-row { display: flex; align-items: center; gap: 8px; background: rgba(255, 255, 255, 0.06); border: 1px solid rgba(255, 255, 255, 0.12); border-radius: 22px; padding: 6px 8px 6px 14px; transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1); }

    .cinput-action-btn { background: transparent; border: none; border-radius: 10px; width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all 0.18s; flex-shrink: 0; }
    .cinput-action-btn:hover { background: rgba(255,255,255,0.10); transform: scale(1.05); }
    #chat-input { flex: 1; background: transparent; border: none; outline: none; color: #fff; font-size: 14px; font-family: 'Inter', sans-serif; caret-color: var(--accent); padding: 4px 0; }

    #send-btn { width: 34px; height: 34px; border-radius: 50%; background: linear-gradient(135deg, #7BE3B0, #38bdf8); color: #000; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.18s cubic-bezier(0.34, 1.56, 0.64, 1); flex-shrink: 0; box-shadow: 0 4px 12px rgba(123,227,176,0.35); }
    #send-btn:hover:not(:disabled) { transform: scale(1.06); box-shadow: 0 6px 16px rgba(123,227,176,0.5); }
    #send-btn:disabled { background: rgba(255,255,255,0.10); cursor: default; box-shadow: none; }
    #send-btn .ms { font-size: 18px; color: #000; font-weight: 700; }

    @media (max-width: 768px) {

      .prompt-card { padding: 10px 12px; border-radius: 12px; }
      .prompt-card-arrow { display: none; }
      .cinput-wrap { padding: 10px 12px max(14px, env(safe-area-inset-bottom, 14px)); }
    }
  </style>
</head>

let isSignedIn = false;
let msgCount = 0;
const MSG_LIMIT = 10;
const TODAY = new Date().toDateString();

function loadMsgCount() {
  const stored = JSON.parse(localStorage.getItem('mg_msgs') || '{}');
  if (stored.date !== TODAY) { localStorage.setItem('mg_msgs', JSON.stringify({date:TODAY,count:0})); return 0; }
  return stored.count || 0;
}
function saveMsgCount(n) { localStorage.setItem('mg_msgs', JSON.stringify({date:TODAY,count:n})); }
msgCount = loadMsgCount();

window.__mgUser = null;
window.applyUserState = function(user) {
  if (!user) return;
  isSignedIn = true;
  window.__mgUser = user;
  closeAuthModal();
};

window.__mgOnSignIn = (user) => {
  localStorage.setItem('mg_user', JSON.stringify(user));
  applyUserState(user);
};

function openAuthModal()  { document.getElementById('auth-modal').style.display = 'flex'; }
function closeAuthModal() { document.getElementById('auth-modal').style.display = 'none'; }

document.addEventListener('DOMContentLoaded', async () => {
  const cached = localStorage.getItem('mg_user');
  if (cached) {
    try { applyUserState(JSON.parse(cached)); } catch(e) {}
  }
  if (supabaseClient) {
    if (window.location.hash.includes('access_token') || window.location.search.includes('code=')) {
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (session?.user) {
        history.replaceState(null, '', window.location.pathname);
        const u = { email: session.user.email, displayName: session.user.user_metadata?.full_name || session.user.email, photoURL: session.user.user_metadata?.avatar_url || null };
        localStorage.setItem('mg_user', JSON.stringify(u));
        applyUserState(u);
      }
    } else {
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (session?.user) {
        const u = { email: session.user.email, displayName: session.user.user_metadata?.full_name || session.user.email, photoURL: session.user.user_metadata?.avatar_url || null };
        localStorage.setItem('mg_user', JSON.stringify(u));
        applyUserState(u);
      }
    }
  }
});

let currentMode = 'chat';
function switchMode(mode) {
  currentMode = mode;
  document.getElementById('tab-chat').classList.toggle('active', mode==='chat');
  document.getElementById('tab-quiz').classList.toggle('active', mode==='quiz');
  document.getElementById('thread').style.display         = mode==='chat' ? 'flex'  : 'none';
  document.getElementById('chat-input-area').style.display = mode==='chat' ? 'block' : 'none';
  document.getElementById('quiz-panel-inner').style.display = mode==='quiz' ? 'flex'  : 'none';
}

const thread  = document.getElementById('thread');
const inputEl = document.getElementById('chat-input');
const sendBtn = document.getElementById('send-btn');

if (inputEl) {
  inputEl.addEventListener('focus', () => {
    if (!isSignedIn) openAuthModal();
    setTimeout(() => { inputEl.scrollIntoView({ behavior: 'smooth', block: 'end' }); }, 300);
  });
  inputEl.addEventListener('click', () => {
    if (!isSignedIn) openAuthModal();
  });
  inputEl.addEventListener('keydown', e => { if (e.key==='Enter') sendMsg(); });
}

const EXAM_SYSTEM = `You are a warm, brilliant tutor and study buddy for Indian exam aspirants (UPSC, TNPSC, SSC, banking, state PSCs).

SOURCE VERIFICATION POLICY:
- Ground answers strictly in SCERT Samacheer Kalvi and NCERT textbooks, citing chapter, class, or syllabus unit.
- Provide clear definitions, key points, simple examples, and bold mark-bearing terms, Articles, Acts, committees, and years.`;

let chatHistory = [];

function addRow(role) {
  const row = document.createElement('div');
  row.className = 'msg-row' + (role==='user' ? ' user-row' : '');
  thread.appendChild(row); return row;
}
function addAv(row, role) {
  const av = document.createElement('div');
  av.className = 'av ' + (role==='ai' ? 'ai' : 'user');
  if (role==='ai') {
    av.innerHTML = '<img src="../assets/icons/mindgains-logo-apple.png" alt="AI" style="width:28px;height:28px;border-radius:8px;object-fit:cover;" />';
  } else {
    const userPhoto = (window.__mgUser && window.__mgUser.photoURL) ? window.__mgUser.photoURL : null;
    if (userPhoto) {
      av.innerHTML = `<img src="${userPhoto}" alt="User" style="width:28px;height:28px;border-radius:50%;object-fit:cover;" />`;
    } else {
      av.innerHTML = `<span class="material-symbols-outlined ms" style="font-size:15px;color:rgba(255,255,255,0.75);">person</span>`;
    }
  }
  row.appendChild(av);
}
function addBubble(row, role, html) {
  const b = document.createElement('div');
  b.className = 'bubble ' + (role==='ai' ? 'ai-bub' : 'user-bub');
  b.innerHTML = html;
  row.appendChild(b); return b;
}
function showTyping() {
  const r = addRow('ai'); r.id = 'typing-row';
  addAv(r, 'ai');
  const b = document.createElement('div');
  b.className = 'bubble ai-bub';
  b.innerHTML = `
    <div class="typing">
      <div class="typing-dots">
        <span class="typing-dot"></span>
        <span class="typing-dot"></span>
        <span class="typing-dot"></span>
      </div>
      <span class="typing-label">Thinking...</span>
    </div>
  `;
  r.appendChild(b);
}
function removeTyping() { const t=document.getElementById('typing-row'); if(t)t.remove(); }

function scrollToTop(row) {
  if (!row || !thread) return;
  const topPos = Math.max(0, row.offsetTop - 12);
  thread.scrollTo({ top: topPos, behavior: 'smooth' });
}

function formatAIResponse(rawText) {
  if (!rawText) return '';
  let text = rawText.replace(/INTERACTIVE\s+PYQ\s+PRACTICE/gi, '');
  text = text.replace(/```([\s\S]*?)```/g, '<pre style="background:rgba(0,0,0,.6);border:1px solid rgba(255,255,255,.1);border-radius:10px;padding:12px;font-family:monospace;font-size:12px;color:#7BE3B0;overflow-x:auto;margin:10px 0;"><code>$1</code></pre>');
  text = text.replace(/^### (.*$)/gim, '<h4 style="font-size:14px;font-weight:700;color:#7BE3B0;margin:12px 0 5px;">$1</h4>');
  text = text.replace(/^## (.*$)/gim, '<h3 style="font-size:15.5px;font-weight:700;color:#fff;margin:14px 0 6px;">$1</h3>');
  text = text.replace(/^# (.*$)/gim, '<h2 style="font-size:17px;font-weight:800;color:#fff;margin:16px 0 8px;">$1</h2>');
  text = text.replace(/`([^`]+)`/g, '<code style="background:rgba(255,255,255,.08);padding:2px 5px;border-radius:4px;font-family:monospace;font-size:12px;color:#7BE3B0;">$1</code>');
  text = text.replace(/\*\*(.*?)\*\*/g, '<strong style="color:#fff;font-weight:700;">$1</strong>');
  text = text.replace(/\*(.*?)\*/g, '<em>$1</em>');
  text = text.replace(/^>\s*(.*$)/gim, '<blockquote style="border-left:3px solid #7BE3B0;background:rgba(123,227,176,.06);padding:8px 12px;border-radius:0 8px 8px 0;margin:8px 0;color:rgba(255,255,255,.85);font-size:12.5px;">$1</blockquote>');
  text = text.replace(/^\s*[-*•]\s+(.*$)/gim, '<li style="margin-bottom:3px;color:rgba(255,255,255,.85);"><span style="color:#7BE3B0;margin-right:5px;">•</span>$1</li>');
  text = text.replace(/(<li[\s\S]*?<\/li>)/gi, '<ul style="list-style:none;padding-left:4px;margin:6px 0;">$1</ul>');
  text = text.replace(/<\/ul>\s*<ul style="list-style:none;padding-left:4px;margin:6px 0;">/gi, '');
  return text.replace(/\n\n/g, '<br><br>').replace(/\n/g, '<br>');
}

const PROMPT_SETS = {
  1: ["Directive Principles of State Policy", "Harappan Civilization — SCERT Samacheer", "Photosynthesis — NCERT Class 11", "Sangam Literature & History"],
  2: ["TNPSC Group 1 Indian Polity PYQs", "UPSC CSE Prelims Economy Solved Questions", "General Tamil Thirukkural PYQs", "TNPSC Group 2 General English PYQs"],
  3: ["20 MCQs on Indian Constitution", "Test me on Sangam Age & Tamil Literature", "Mixed UPSC Prelims Environment Quiz", "TNPSC Aptitude & Shape Counting Quiz"],
  4: ["Samacheer Kalvi Class 10 Science Chapter 8", "NCERT Indian Polity Quick Revision Notes", "Samacheer Kalvi Tamil Grammar Summary", "UPSC History 1857 Revolt Key Points"]
};

const currentPromptTexts = { 1: PROMPT_SETS[1][0], 2: PROMPT_SETS[2][0], 3: PROMPT_SETS[3][0], 4: PROMPT_SETS[4][0] };

function startTypewriter(cardId) {
  const el = document.getElementById(`ptype-${cardId}`);
  if (!el) return;
  const list = PROMPT_SETS[cardId];
  let listIdx = 0, charIdx = list[0].length, isDeleting = false;

  function step() {
    const targetText = list[listIdx];
    if (isDeleting) {
      charIdx--;
      el.textContent = targetText.substring(0, charIdx) + '▌';
      currentPromptTexts[cardId] = targetText.substring(0, charIdx);
      if (charIdx <= 0) { isDeleting = false; listIdx = (listIdx + 1) % list.length; setTimeout(step, 400); return; }
      setTimeout(step, 20);
    } else {
      charIdx++;
      el.textContent = targetText.substring(0, charIdx) + '▌';
      currentPromptTexts[cardId] = targetText.substring(0, charIdx);
      if (charIdx >= targetText.length) { el.textContent = targetText; currentPromptTexts[cardId] = targetText; isDeleting = true; setTimeout(step, 2200); return; }
      setTimeout(step, 45 + Math.random() * 35);
    }
  }
  setTimeout(step, cardId * 250);
}
[1, 2, 3, 4].forEach(startTypewriter);

function pastePrompt(cardId) {
  const text = currentPromptTexts[cardId] || PROMPT_SETS[cardId][0];
  inputEl.value = text;
  inputEl.focus();
  inputEl.setSelectionRange(text.length, text.length);
}

async function sendMsg(override) {
  if (currentMode !== 'chat') return;
  if (!isSignedIn) { openAuthModal(); return; }

  const text = override || inputEl.value.trim();
  if (!text) return;

  inputEl.value = '';
  sendBtn.disabled = true;
  msgCount++;
  saveMsgCount(msgCount);

  const es = document.getElementById('empty-state');
  if (es) es.remove();

  chatHistory.push({ role: 'user', content: text });
  const uRow = addRow('user'); addAv(uRow, 'user'); addBubble(uRow, 'user', text);
  scrollToTop(uRow);
  showTyping();

  let aiRow = null, aiBub = null;

  async function tryORStream(key, keyNum, modelName) {
    const body = { model: modelName, messages: [{ role: 'system', content: EXAM_SYSTEM }, ...chatHistory.slice(-10)], stream: true, max_tokens: 4096 };
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), 3500);

    const res = await fetch('https://openrouter.ai/api/v1/chat/completions', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${key}`, 'HTTP-Referer': 'https://mindgains.ai', 'X-Title': 'MindGains AI' },
      body: JSON.stringify(body),
      signal: controller.signal
    });
    clearTimeout(timer);
    if (!res.ok) return null;

    const reader = res.body.getReader();
    const decoder = new TextDecoder('utf-8');
    let fullText = '', buffer = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split('\n');
      buffer = lines.pop();
      for (const line of lines) {
        const trimmed = line.trim();
        if (!trimmed || trimmed.startsWith(':') || trimmed === 'data: [DONE]') continue;
        if (trimmed.startsWith('data: ')) {
          try {
            const parsed = JSON.parse(trimmed.slice(6));
            const delta = parsed.choices?.[0]?.delta?.content || '';
            if (delta) {
              if (!aiRow) {
                removeTyping();
                aiRow = addRow('ai'); addAv(aiRow, 'ai');
                aiBub = addBubble(aiRow, 'ai', '');
                scrollToTop(uRow);
              }
              fullText += delta;
              aiBub.innerHTML = formatAIResponse(fullText);
            }
          } catch(e) {}
        }
      }
    }
    return fullText.trim() ? fullText : null;
  }

  let finalReply = null;
  for (let i = 0; i < OR_KEYS.length; i++) {
    for (let m = 0; m < OR_MODELS.length; m++) {
      try { finalReply = await tryORStream(OR_KEYS[i], i + 1, OR_MODELS[m]); if (finalReply) break; } catch(e) {}
    }
    if (finalReply) break;
  }

  removeTyping();
  sendBtn.disabled = false;
  if (finalReply) {
    chatHistory.push({ role: 'assistant', content: finalReply });
    if (aiBub) aiBub.innerHTML = formatAIResponse(finalReply);
    scrollToTop(uRow);
  } else {
    chatHistory.pop();
    if (!aiRow) { aiRow = addRow('ai'); addAv(aiRow, 'ai'); addBubble(aiRow, 'ai', '<strong>AI is temporarily busy.</strong> Please try asking again.'); }
    scrollToTop(uRow);
  }
}

window.addEventListener('DOMContentLoaded', () => {
  const autoPrompt = sessionStorage.getItem('mg_auto_prompt');
  if (autoPrompt) {
    sessionStorage.removeItem('mg_auto_prompt');
    inputEl.value = autoPrompt;
    setTimeout(() => {
      if (isSignedIn) { sendMsg(autoPrompt); } else { openAuthModal(); }
    }, 450);
  }
});
