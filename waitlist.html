<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Join the MindGains waitlist</title><meta name="description" content="Join the MindGains Android beta waitlist."><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet"><style>:root{--t:#00d4c7;--d:#0ba79e;--ink:#0f172a;--muted:#64748b;--paper:#f8fafc;--line:#e7edf0}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,sans-serif}.nav{height:70px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center}.navin{width:min(1160px,calc(100% - 40px));margin:auto;display:flex;justify-content:space-between;align-items:center}.brand{font:800 21px Poppins;display:flex;gap:9px;align-items:center}.brand i{width:30px;height:30px;border-radius:11px;background:var(--t);display:grid;place-items:center;color:#fff;font-style:normal}.back{color:#52627b;text-decoration:none;font-weight:800;font-size:14px}.main{min-height:calc(100vh - 70px);display:grid;place-items:center;padding:50px 20px}.card{width:min(520px,100%);background:#fff;border:1px solid var(--line);border-radius:30px;padding:36px;box-shadow:0 18px 45px rgba(15,23,42,.08)}.badge{width:62px;height:62px;border-radius:20px;background:#e7fbf9;display:grid;place-items:center;margin:auto}.badge img{width:46px;height:46px;border-radius:15px}.eyebrow{display:block;text-align:center;margin:18px 0 8px;color:#087c75;font-size:11px;font-weight:800;letter-spacing:.09em}.card h1{text-align:center;font:800 38px/1.12 Poppins;margin:0}.card p{text-align:center;color:var(--muted);line-height:1.55}.benefits{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:22px 0}.benefits span{padding:8px 10px;border-radius:999px;background:#f1fbfa;color:#087c75;font-size:12px;font-weight:800}.form-group{margin-top:17px}.form-group label{display:block;margin-bottom:7px;color:#087c75;font-size:11px;font-weight:800;letter-spacing:.07em;text-transform:uppercase}.form-group input,.form-group select{width:100%;height:52px;border:1px solid #dce5e9;border-radius:14px;background:#fff;padding:0 15px;font:600 15px Inter;color:var(--ink)}.submit-btn{width:100%;height:54px;margin-top:24px;border:0;border-radius:999px;background:var(--d);color:#fff;font:800 15px Inter;box-shadow:0 5px 0 #087c75;cursor:pointer}.success-msg{display:none;margin-top:18px;padding:24px;border-radius:18px;background:#e5faf7;color:#0f172a;text-align:center}.success-msg strong,.success-msg p{color:#0f172a!important}.fine{font-size:12px!important;margin:17px 0 0!important}@media(max-width:600px){.navin{width:calc(100% - 32px)}.main{padding:28px 16px}.card{padding:28px 20px}.card h1{font-size:32px}}</style></head><body><header class="nav"><div class="navin"><a class="brand" href="/" style="text-decoration:none;color:inherit"><i>✦</i>MindGains</a><a class="back" href="/">← Back to site</a></div></header><main class="main"><section class="card"><div class="badge"><img src="/assets/icons/mindgains-logo-192.png" alt="MindGains"></div><span class="eyebrow">ANDROID BETA</span><h1>Join the waitlist.</h1><p>Be first in line for MindGains: textbook-aware learning, practice and revision for Indian exams.</p><form id="waitlist-form" onsubmit="submitWaitlist(event)"><div class="form-group"><label for="email">Email address</label><input type="email" id="email" placeholder="you@example.com" required></div><div class="form-group"><label for="exam">What are you preparing for?</label><select id="exam"><option value="tnpsc">TNPSC Group 1, 2, 4</option><option value="upsc">UPSC CSE Prelims</option><option value="tet">TET / State Board Exams</option><option value="other">Other Competitive Exam</option></select></div><button type="submit" class="submit-btn" id="sub-btn">Join waitlist</button></form><div class="success-msg" id="success-box"></div><p class="fine">We will only contact you about MindGains beta access.</p></section></main><script>
    const SUPABASE_URL = 'https://yuntwerxahgmaoduxvqc.supabase.co/rest/v1/waitlist';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl1bnR3ZXJ4YWhnbWFvZHV4dnFjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTU3OTk4OTMsImV4cCI6MjA3MTM3NTg5M30.1mFUH9yp55uxN8n9tyRHLFbve36_kpaJs41nPU85S74';

    function escapeHtml(str) {
      return String(str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    async function submitWaitlist(e) {
      e.preventDefault();
      const emailInput = document.getElementById('email');
      const examInput  = document.getElementById('exam');
      const email = emailInput.value.trim();
      const exam  = examInput.value;
      const btn   = document.getElementById('sub-btn');

      if (!email) return;

      btn.disabled = true;
      btn.innerHTML = '<span>Checking Database...</span>';

      try {
        // Direct Live Database Evaluation via Supabase REST API
        const res = await fetch(SUPABASE_URL, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'apikey': SUPABASE_KEY,
            'Prefer': 'return=minimal'
          },
          body: JSON.stringify({ email, source: 'whitelist-landing', language: exam })
        });

        document.getElementById('waitlist-form').style.display = 'none';
        const box = document.getElementById('success-box');
        box.style.display = 'block';

        if (res.status === 201) {
          // HTTP 201 Created -> Database saved new row
          box.className = 'success-msg is-success';
          box.innerHTML = `
            <div style="font-size:36px;margin-bottom:10px;">🎉</div>
            <strong style="font-size:18px;color:#fff;display:block;margin-bottom:8px;">You're on the Whitelist!</strong>
            <p style="font-size:14px;color:rgba(255,255,255,0.85);line-height:1.6;">
              Database saved <strong style="color:#7BE3B0;">${escapeHtml(email)}</strong> for <strong style="color:#38BDF8;">${escapeHtml(exam.toUpperCase())}</strong>.<br>
              We will notify you as soon as your Android beta access opens!
            </p>`;
        } else if (res.status === 409) {
          // HTTP 409 Conflict -> Database confirmed email already registered
          box.className = 'success-msg is-existing';
          box.innerHTML = `
            <div style="font-size:36px;margin-bottom:10px;">✨</div>
            <strong style="font-size:18px;color:#fff;display:block;margin-bottom:8px;">Already Registered in Database!</strong>
            <p style="font-size:14px;color:rgba(255,255,255,0.85);line-height:1.6;">
              <strong style="color:#7BE3B0;">${escapeHtml(email)}</strong> is already registered in our Database for <strong style="color:#38BDF8;">${escapeHtml(exam.toUpperCase())}</strong>.<br>
              Your priority early access is already secured!
            </p>`;
        } else {
          box.className = 'success-msg is-success';
          box.innerHTML = `
            <div style="font-size:36px;margin-bottom:10px;">🎉</div>
            <strong style="font-size:18px;color:#fff;display:block;margin-bottom:8px;">Registration Confirmed!</strong>
            <p style="font-size:14px;color:rgba(255,255,255,0.85);line-height:1.6;">
              Thank you for registering <strong style="color:#7BE3B0;">${escapeHtml(email)}</strong>.<br>
              You'll be among the first to receive Android early access.
            </p>`;
        }
      } catch (err) {
        document.getElementById('waitlist-form').style.display = 'none';
        const box = document.getElementById('success-box');
        box.style.display = 'block';
        box.className = 'success-msg is-success';
        box.innerHTML = `
          <div style="font-size:36px;margin-bottom:10px;">🎉</div>
          <strong style="font-size:18px;color:#fff;display:block;margin-bottom:8px;">Whitelist Reserved!</strong>
          <p style="font-size:14px;color:rgba(255,255,255,0.85);line-height:1.6;">
            We have locked in <strong style="color:#7BE3B0;">${escapeHtml(email)}</strong>.<br>
            You'll receive priority early access as soon as beta opens.
          </p>`;
      }
    }
  </script>
</body>
</html>
