  animation:gcFlow 7s ease-in-out infinite,gcGlow 3.2s ease-in-out infinite;transition:transform .25s cubic-bezier(.2,1.4,.4,1),filter .25s}
.gold-cta::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1.5px;z-index:-1;pointer-events:none;
  background:conic-gradient(from var(--pa),transparent 0 62%,rgba(255,255,255,.95) 72%,#ffe7a8 76%,transparent 86%);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;animation:gcSpin 3.6s linear infinite}
.gold-cta::after{content:"";position:absolute;top:-40%;bottom:-40%;width:38%;left:-60%;z-index:1;pointer-events:none;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.85) 45%,rgba(255,255,255,.95) 50%,transparent 60%);transform:skewX(-20deg);mix-blend-mode:overlay;animation:gcSweep 4.2s cubic-bezier(.6,0,.2,1) infinite}

.gold-cta:hover{transform:translateY(-1px) scale(1.04);filter:saturate(1.15) brightness(1.05)}
