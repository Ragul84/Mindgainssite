<script type="module">
import * as THREE from 'three';
import { CSS3DRenderer, CSS3DObject } from 'three/addons/renderers/CSS3DRenderer.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

const W = () => innerWidth, H = () => innerHeight;
const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('gl'), antialias: true });
renderer.setPixelRatio(Math.min(2, devicePixelRatio)); renderer.setSize(W(), H());
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.5;

const scene = new THREE.Scene(); scene.background = new THREE.Color(0x07040a); scene.fog = new THREE.Fog(0x07040a, 45, 95);
const cam = new THREE.PerspectiveCamera(62, W() / H(), 0.1, 200);
const css = new CSS3DRenderer(); css.setSize(W(), H()); document.getElementById('css').appendChild(css.domElement);
const cssScene = new THREE.Scene();
const mat = (c, r = .7, m = 0, x = {}) => new THREE.MeshStandardMaterial({ color: c, roughness: r, metalness: m, ...x });

// ---- textures drawn in code
function canvasTex(w, h, draw, rep) { const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'), w, h); const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; if (rep) { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(...rep); } return t; }
const woodSlats = canvasTex(512, 512, (g, w, h) => { for (let x = 0; x < w; x += 32) { const l = 38 + Math.random() * 10; g.fillStyle = `hsl(24,52%,${l}%)`; g.fillRect(x, 0, 28, h); g.fillStyle = 'rgba(0,0,0,.55)'; g.fillRect(x + 28, 0, 4, h); for (let k = 0; k < 18; k++) { g.strokeStyle = `rgba(70,30,10,${.08 + Math.random() * .1})`; g.beginPath(); const yy = Math.random() * h; g.moveTo(x, yy); g.bezierCurveTo(x + 9, yy + 20, x + 19, yy - 20, x + 28, yy + 6); g.stroke(); } } }, [6, 1]);
const carpet = canvasTex(256, 256, (g, w, h) => { g.fillStyle = '#4a0f1c'; g.fillRect(0, 0, w, h); for (let i = 0; i < 2600; i++) { g.fillStyle = `rgba(${120 + Math.random() * 60},20,40,.25)`; g.fillRect(Math.random() * w, Math.random() * h, 2, 2); } g.strokeStyle = 'rgba(255,190,90,.18)'; g.lineWidth = 3; for (let i = 0; i < w; i += 64) { g.beginPath(); g.moveTo(i, 0); g.lineTo(i + 32, h); g.stroke(); } }, [10, 10]);
const velvet = canvasTex(256, 32, (g, w, h) => { const gr = g.createLinearGradient(0, 0, w, 0); for (let i = 0; i <= 16; i++) gr.addColorStop(i / 16, i % 2 ? '#8e0d1c' : '#c4182b'); g.fillStyle = gr; g.fillRect(0, 0, w, h); }, [3, 1]);

// ---- hall: floor, walls, ceiling
const HALL_W = 26, HALL_D = 40;
const floor = new THREE.Mesh(new THREE.PlaneGeometry(HALL_W, HALL_D), mat(0xffffff, .95, 0, { map: carpet }));
floor.rotation.x = -Math.PI / 2; floor.position.z = 4; floor.receiveShadow = true; scene.add(floor);
for (const s of [-1, 1]) {
  const wall = new THREE.Mesh(new THREE.PlaneGeometry(HALL_D, 14), mat(0xffffff, .6, 0, { map: woodSlats }));
  wall.position.set(s * HALL_W / 2, 7, 4); wall.rotation.y = -s * Math.PI / 2; wall.receiveShadow = true; scene.add(wall);
  // warm wall sconces
  for (let k = 0; k < 6; k++) { const z = -10 + k * 5.5; const lamp = new THREE.Mesh(new THREE.SphereGeometry(.18, 12, 8), new THREE.MeshBasicMaterial({ color: 0xffc36b })); lamp.position.set(s * (HALL_W / 2 - .15), 4.2, z); scene.add(lamp);
    const glow = new THREE.PointLight(0xffa64d, 4, 7, 2); glow.position.set(s * (HALL_W / 2 - .6), 4.2, z); scene.add(glow); }
}
const back = new THREE.Mesh(new THREE.PlaneGeometry(HALL_W, 14), mat(0x2a1a14, .8)); back.position.set(0, 7, 24); back.rotation.y = Math.PI; scene.add(back);
const ceil = new THREE.Mesh(new THREE.PlaneGeometry(HALL_W, HALL_D), mat(0x120a10, .9)); ceil.rotation.x = Math.PI / 2; ceil.position.set(0, 14, 4); scene.add(ceil);
for (let i = 0; i < 70; i++) { const d = new THREE.Mesh(new THREE.SphereGeometry(.05, 6, 4), new THREE.MeshBasicMaterial({ color: 0xfff1c9 })); d.position.set((Math.random() - .5) * (HALL_W - 2), 13.9, -12 + Math.random() * 34); scene.add(d); }

// ---- stage, proscenium, curtains, screen
const stage = new THREE.Mesh(new RoundedBoxGeometry(HALL_W - 2, 1.2, 4, 2, .1), mat(0x3b2216, .5)); stage.position.set(0, .6, -15); stage.receiveShadow = true; scene.add(stage);
const lip = new THREE.Mesh(new THREE.BoxGeometry(HALL_W - 2, .12, .2), new THREE.MeshBasicMaterial({ color: 0xffc36b })); lip.position.set(0, 1.21, -13.05); scene.add(lip);
const prosc = new THREE.Mesh(new THREE.BoxGeometry(HALL_W, 2.2, .8), mat(0x2b1209, .6)); prosc.position.set(0, 12.6, -16.4); scene.add(prosc);
function curtain(w, h, folds) { const g = new THREE.PlaneGeometry(w, h, folds * 6, 1); const p = g.attributes.position; for (let i = 0; i < p.count; i++) p.setZ(i, Math.sin(p.getX(i) / w * folds * Math.PI * 2) * .35); g.computeVertexNormals(); return new THREE.Mesh(g, mat(0xffffff, .55, 0, { map: velvet, side: THREE.DoubleSide })); }
for (const s of [-1, 1]) { const c = curtain(4.2, 11.2, 5); c.position.set(s * 10.6, 6.8, -16.1); scene.add(c); }
const valance = curtain(HALL_W - 1, 1.6, 22); valance.position.set(0, 11.6, -16); scene.add(valance);
// the screen (16:9) – the YouTube player is laid exactly over it with CSS3D
const SW = 16, SH = 9;
const screenFrame = new THREE.Mesh(new THREE.BoxGeometry(SW + .4, SH + .4, .2), mat(0x0a0a0a, .4)); screenFrame.position.set(0, 7, -16.5); scene.add(screenFrame);
const poster = new THREE.TextureLoader().load('../../assets/miga/miga-companion-scene.png', (t) => { t.colorSpace = THREE.SRGBColorSpace; });
const screen = new THREE.Mesh(new THREE.PlaneGeometry(SW, SH), new THREE.MeshBasicMaterial({ map: poster, toneMapped: false })); screen.position.set(0, 7, -16.38); scene.add(screen);
const screenLight = new THREE.RectAreaLight ? null : null;
const spill = new THREE.PointLight(0x9bb6ff, 25, 26, 1.6); spill.position.set(0, 7, -12); scene.add(spill);
// ---- synced broadcast: timetable.json decides what plays; everyone computes the same position from the clock
const YT_W = 1600, YT_H = 900; let ytObj = null, ytNow = '', ytEl = null, ytReady = false, soundOn = false;
function yCmd(func, args = []) { try { ytEl && ytEl.contentWindow.postMessage(JSON.stringify({ event: 'command', func, args }), '*'); } catch (e) {} }
function playOnScreen(id, start) {
  const key = id + '@' + Math.floor(start / 30); if (key === ytNow) return; ytNow = key;
  if (ytObj) { cssScene.remove(ytObj); ytObj = null; }
  if (!id) { screen.visible = true; screen.material.opacity = 1; return; }
  const el = document.createElement('iframe'); el.className = 'yt'; el.width = YT_W; el.height = YT_H; el.style.border = '0';
  el.allow = 'autoplay; encrypted-media; picture-in-picture; fullscreen';
  el.src = `https://www.youtube.com/embed/${encodeURIComponent(id)}?autoplay=1&mute=${soundOn ? 0 : 1}&start=${Math.floor(start)}&controls=0&disablekb=1&modestbranding=1&rel=0&playsinline=1&enablejsapi=1&origin=${encodeURIComponent(location.origin)}`;
  el.addEventListener('load', () => { ytReady = true; setTimeout(() => { yCmd(soundOn ? 'unMute' : 'mute'); if (soundOn) yCmd('setVolume', [100]); hideLoader(); }, 600); });
  ytEl = el;
  ytObj = new CSS3DObject(el); ytObj.scale.setScalar(SW / YT_W); ytObj.position.copy(screen.position); cssScene.add(ytObj);
  screen.material.transparent = true; screen.material.opacity = 0; screen.visible = false;
}
if (location.search.includes('clean')) document.body.classList.add('clean');
const DAYS = ['sun', 'mon', 'tue', 'wed', 'thu', 'fri', 'sat'];
const ist = () => { const d = new Date(Date.now() + (5.5 * 60 + new Date().getTimezoneOffset()) * 60000); return d; };
const mins = (hm) => { const [h, m] = hm.split(':').map(Number); return h * 60 + m; };
const fmt = (m) => `${String(Math.floor(m / 60) % 24).padStart(2, '0')}:${String(m % 60).padStart(2, '0')}`;
let TT = null, hall = new URLSearchParams(location.search).get('hall') || 'main';
function blocksFor(h, day) {
  const H = TT.halls[h], list = H.daily.map((b) => ({ ...b }));
  if (day === 'sun' && H.sunday_extra) { const x = H.sunday_extra; for (const b of list) if (mins(b.from) < mins(x.to) && mins(b.from) >= mins(x.from)) b.from = x.to; list.push({ ...x }); }
  if (H.daily.some((b) => b.sharedWith)) for (const b of list) if (b.sharedWith) { const src = TT.halls[b.sharedWith].daily.find((x) => x.from === b.from); if (src && !b.videos.length) b.videos = src.videos; }
  return list.sort((a, b) => mins(a.from) - mins(b.from));
}
function current() {
  const now = ist(), day = DAYS[now.getDay()], m = now.getHours() * 60 + now.getMinutes(), s = m * 60 + now.getSeconds();
  const H = TT.halls[hall], list = blocksFor(hall, day);
  let b = null; for (const x of list) { const f = mins(x.from), t = mins(x.to); if (t > f ? (m >= f && m < t) : (m >= f || m < t)) b = x; }

let mine = seats.find((s) => s.row === 'G' && s.n === 10);

// ---- camera views with smooth flights

const ray = new THREE.Raycaster(), ptr = new THREE.Vector2();

// ---- live room: real seats, viewer count, MIGA quiz, top 5, reactions

let qTimer = null;

  document.getElementById('qq').textContent = q.q;
  document.getElementById('qo').innerHTML = q.opts.map((o, i) => `<button data-i="${i}">${String(o).replace(/[<>&]/g, '')}</button>`).join('');

  clearInterval(qTimer); qTimer = setInterval(() => { const left = Math.max(0, q.ends - Date.now()); document.getElementById('qbar').style.width = (left / 150) + '%'; document.getElementById('qk').textContent = `MIGA ASKS · ${Math.ceil(left / 1000)} S`; if (!left) clearInterval(qTimer); }, 250); }

let t0 = performance.now();
(function frame(now) { const dt = Math.min(.05, (now - t0) / 1000); t0 = now; const k = 1 - Math.pow(.02, dt);
  { const f = mode === 'seat' ? 92 : 62; if (Math.abs(cam.fov - f) > .1) { cam.fov += (f - cam.fov) * k; cam.updateProjectionMatrix(); } }

  else { orbit.update(); camPos.copy(cam.position); camLook.copy(orbit.target); }
  if (mine) mine.m.emissiveIntensity = .7 + .3 * Math.sin(now / 250);
  renderer.render(scene, cam); css.render(cssScene, cam); if (!frame.n) { frame.n = 1; document.getElementById('ls').textContent = 'TAKING YOU TO YOUR SEAT…'; } requestAnimationFrame(frame); })(t0);
