const fans = [villager(-6.6, -12, 0xff7a45, Math.PI / 2), villager(-6.9, -13.3, 0xffd23f, Math.PI / 2), villager(6.7, -16, 0x7c4dff, -Math.PI / 2), villager(6.9, -17.4, 0x1cb0f6, -Math.PI / 2), villager(-6.8, -40, 0xff4b8b, Math.PI / 2)];

// MIGA in 3D: a round blue wolf pup running beside the batch
function miga() {
  const g = new THREE.Group(), blue = mat(0x2cb7ec, .45), light = mat(0xeaf7ff, .5), dark = mat(0x1b2340, .3), purple = mat(0x8b5cf6, .45);
  const body = new THREE.Mesh(new THREE.SphereGeometry(.42, 24, 18), blue); body.scale.set(1, 1.1, .95); body.position.y = .62; body.castShadow = true; g.add(body);
  const belly = new THREE.Mesh(new THREE.SphereGeometry(.3, 20, 14), light); belly.position.set(0, .58, .22); belly.scale.set(1, 1.1, .6); g.add(belly);
  const head = new THREE.Mesh(new THREE.SphereGeometry(.46, 26, 20), blue); head.position.y = 1.28; head.castShadow = true; g.add(head);
  const muzzle = new THREE.Mesh(new THREE.SphereGeometry(.24, 18, 12), light); muzzle.position.set(0, 1.16, .34); muzzle.scale.set(1.1, .8, .8); g.add(muzzle);
  const nose = new THREE.Mesh(new THREE.SphereGeometry(.07, 12, 8), dark); nose.position.set(0, 1.22, .55); g.add(nose);
  for (const sx of [-1, 1]) {
    const eye = new THREE.Mesh(new THREE.SphereGeometry(.1, 14, 10), dark); eye.position.set(sx * .17, 1.36, .38); eye.scale.set(.85, 1.1, .6); g.add(eye);
    const glint = new THREE.Mesh(new THREE.SphereGeometry(.03, 8, 6), mat(0xffffff, .2)); glint.position.set(sx * .17 + .03, 1.4, .45); g.add(glint);
    const ear = new THREE.Mesh(new THREE.ConeGeometry(.16, .42, 4), blue); ear.position.set(sx * .3, 1.72, 0); ear.rotation.z = -sx * .35; ear.castShadow = true; g.add(ear);
    const inner = new THREE.Mesh(new THREE.ConeGeometry(.08, .24, 4), mat(0xffd1e6, .5)); inner.position.set(sx * .3, 1.68, .07); inner.rotation.z = -sx * .35; g.add(inner);
    const cheek = new THREE.Mesh(new THREE.SphereGeometry(.06, 10, 8), mat(0xff9ec4, .6)); cheek.position.set(sx * .3, 1.18, .36); g.add(cheek);
  }
  const tuft = new THREE.Mesh(new THREE.ConeGeometry(.16, .4, 6), purple); tuft.position.set(.05, 1.78, .1); tuft.rotation.z = -.4; g.add(tuft);
  const tail = new THREE.Mesh(new THREE.CapsuleGeometry(.11, .4, 4, 10), blue); tail.position.set(.1, .7, -.42); tail.rotation.x = -.9; g.add(tail);
  const legs = [];
  for (const [lx, lz] of [[-.18, .12], [.18, .12], [-.18, -.12], [.18, -.12]]) { const l = new THREE.Mesh(new THREE.CapsuleGeometry(.09, .2, 4, 8), blue); l.position.set(lx, .2, lz); l.castShadow = true; g.add(l); legs.push(l); }
  g.userData = { legs, tail };
  return g;
}
const MIGA = miga(); MIGA.position.set(-3.1, 0, .6); MIGA.scale.setScalar(1.15); MIGA.rotation.y = .35; scene.add(MIGA);

function resize() {
  const w = cv.clientWidth, h = cv.clientHeight; renderer.setSize(w, h, false); cam.aspect = w / h; cam.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();
cam.position.set(0, 6.4, 19); cam.lookAt(0, 2.6, -22);
const clock = new THREE.Clock();
function frame() {
  const t = clock.getElapsedTime();
  for (const s of crowd) { const ph = t * 9 + s.userData.ph, L = s.userData.limbs; L[0].rotation.x = Math.sin(ph) * .7; L[1].rotation.x = -Math.sin(ph) * .7; L[2].rotation.x = -Math.sin(ph) * .6; L[3].rotation.x = Math.sin(ph) * .6; s.position.y = Math.abs(Math.sin(ph)) * .07; }
  for (const f of fans) { const ph = t * 8 + f.userData.ph; f.userData.arms[0].rotation.z = .5 + Math.sin(ph) * .5 + 2.2; f.userData.arms[1].rotation.z = -.5 - Math.sin(ph) * .5 - 2.2; f.position.y = Math.max(0, Math.sin(ph)) * .15; }
  { const ph = t * 10; MIGA.position.y = Math.abs(Math.sin(ph)) * .18; MIGA.userData.legs.forEach((l, i) => l.rotation.x = Math.sin(ph + i * Math.PI / 2) * .8); MIGA.userData.tail.rotation.z = Math.sin(t * 6) * .4; }
  renderer.render(scene, cam); requestAnimationFrame(frame);
}
frame();
