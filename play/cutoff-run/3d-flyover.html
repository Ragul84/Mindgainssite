<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Cut-Off Run · Flyover test</title>
<meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
html,body{margin:0;height:100%;background:#0f1c33;overflow:hidden;font-family:Nunito,system-ui,sans-serif}
#wrap{position:relative;height:100%;max-width:480px;margin:0 auto;overflow:hidden}
canvas{display:block;width:100%;height:100%}
.hud{position:absolute;left:12px;right:12px;top:12px;display:flex;align-items:center;gap:10px}
.pill{background:rgba(255,255,255,.95);border-radius:14px;padding:5px 12px;font:900 15px Nunito;color:#3c3c3c;box-shadow:0 3px 0 rgba(0,0,0,.18)}
.bar{flex:1;height:10px;border-radius:5px;background:rgba(0,0,0,.28)}.bar i{display:block;height:100%;width:38%;border-radius:5px;background:#ffc800}
.q{position:absolute;left:14px;right:14px;top:56px;background:rgba(255,255,255,.96);border-radius:18px;padding:11px 14px 12px;box-shadow:0 10px 28px rgba(0,0,0,.3);color:#3c3c3c}
.q small{font:800 12px Nunito;color:#777;letter-spacing:.08em}
.q b{display:block;font:900 17px/1.25 Nunito;margin:5px 0 9px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opts span{border:2px solid #e5e5e5;border-radius:14px;padding:10px 8px;font:900 15px Nunito;text-align:center;box-shadow:0 3px 0 #e5e5e5;background:#fff}
.opts span.a{border-color:#1cb0f6;box-shadow:0 3px 0 #1899d6}.opts span.b{border-color:#58cc02;box-shadow:0 3px 0 #46a302}
.count{position:absolute;left:50%;transform:translateX(-50%);bottom:30%;background:#fff;border-radius:12px;padding:3px 14px;font:24px "Lilita One";color:#3c3c3c;box-shadow:0 4px 0 rgba(0,0,0,.25)}
</style></head><body>
<div id="wrap"><canvas id="c"></canvas>
<div class="hud"><span class="pill">Level 3</span><div class="bar"><i></i></div><span class="pill">🪙 240</span></div>
<div class="q"><small>Q.2 · POLITY</small><b>Which Article lets Parliament make laws on State List subjects?</b><div class="opts"><span class="a">A · Article 249</span><span class="b">B · Article 252</span></div></div>
<div class="count">12</div>
</div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
<script type="module">
// Art test: an elevated road (flyover) above an Indian city at golden hour, seen from a high camera.
// Calm grey road and a hazy city below; the bright, glowing things are the gates and the batch.
import * as THREE from 'three';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

const cv = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas: cv, antialias: true });
renderer.setPixelRatio(Math.min(2, devicePixelRatio));
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.1;
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const scene = new THREE.Scene();
const FOG = new THREE.Color(0x9aa9d8);
scene.fog = new THREE.FogExp2(FOG, .0042);
const cam = new THREE.PerspectiveCamera(40, 1, .5, 900);

// sky: deep blue overhead into a warm hazy horizon, sun low on the left
const SUN = new THREE.Vector3(-.6, .22, -.75).normalize();
scene.add(new THREE.Mesh(new THREE.SphereGeometry(800, 32, 16), new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false, fog: false, uniforms: { uSun: { value: SUN } },
  vertexShader: 'varying vec3 d;void main(){d=normalize(position);gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',
  fragmentShader: `uniform vec3 uSun;varying vec3 d;void main(){float y=d.y;vec3 top=vec3(.16,.27,.55),mid=vec3(.98,.62,.40),hz=vec3(1.,.80,.58);
    vec3 c=y>0.?mix(hz,mix(mid,top,smoothstep(.08,.5,y)),smoothstep(0.,.12,y)):hz*.9;float s=max(dot(normalize(d),uSun),0.);
    c+=vec3(1.,.85,.6)*(pow(s,300.)*3.+pow(s,18.)*.5+pow(s,4.)*.15);gl_FragColor=vec4(c,1.);}`
})));

// light: low warm sun, cool blue fill from the sky
scene.add(new THREE.HemisphereLight(0x7ea6ff, 0x3a3048, 1.0));
const sun = new THREE.DirectionalLight(0xffd2a8, 1.9);
sun.position.copy(SUN).multiplyScalar(80); sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -16, right: 16, top: 30, bottom: -30, near: 1, far: 200 });
sun.shadow.bias = -.0005; sun.shadow.radius = 3; scene.add(sun, sun.target); sun.target.position.set(0, 0, -15);

const mat = (c, r = .8, extra = {}) => new THREE.MeshStandardMaterial({ color: c, roughness: r, ...extra });
const DECK_Y = 0, ROAD_W = 6.6;

// ---- the flyover: deck, side barriers with a warm top rail, lane marks, pillars into the haze
const deckL = 400;
const deck = new THREE.Mesh(new THREE.BoxGeometry(ROAD_W + 1.6, .8, deckL), mat(0x8c8f99, .9)); deck.position.set(0, DECK_Y - .4, -deckL / 2 + 20); deck.receiveShadow = true; scene.add(deck);
const asphalt = new THREE.Mesh(new THREE.PlaneGeometry(ROAD_W, deckL), mat(0x6f737e, .95)); asphalt.rotation.x = -Math.PI / 2; asphalt.position.set(0, DECK_Y + .01, -deckL / 2 + 20); asphalt.receiveShadow = true; scene.add(asphalt);
for (const sx of [-1, 1]) {
  const wall = new THREE.Mesh(new RoundedBoxGeometry(.5, .9, deckL, 2, .08), mat(0xd9d4cc, .7)); wall.position.set(sx * (ROAD_W / 2 + .5), DECK_Y + .45, -deckL / 2 + 20); wall.castShadow = wall.receiveShadow = true; scene.add(wall);
  const rail = new THREE.Mesh(new THREE.BoxGeometry(.12, .1, deckL), mat(0xf2e8d8, .4)); rail.position.set(sx * (ROAD_W / 2 + .5), DECK_Y + 1.25, -deckL / 2 + 20); scene.add(rail);
  for (let z = 15; z > -deckL + 20; z -= 3) { const p = new THREE.Mesh(new THREE.BoxGeometry(.08, .4, .08), mat(0xf2e8d8, .4)); p.position.set(sx * (ROAD_W / 2 + .5), DECK_Y + 1.05, z); scene.add(p); }
  const edge = new THREE.Mesh(new THREE.PlaneGeometry(.18, deckL), mat(0xffffff, .5)); edge.rotation.x = -Math.PI / 2; edge.position.set(sx * (ROAD_W / 2 - .35), DECK_Y + .02, -deckL / 2 + 20); scene.add(edge);
}
for (let z = 18; z > -deckL; z -= 7) { const m = new THREE.Mesh(new THREE.PlaneGeometry(.2, 3), mat(0xffffff, .5)); m.rotation.x = -Math.PI / 2; m.position.set(0, DECK_Y + .02, z); scene.add(m); }
for (let z = 0; z > -deckL; z -= 28) {
  const pil = new THREE.Mesh(new THREE.CylinderGeometry(1.4, 1.7, 60, 16), mat(0xb9b4ac, .9)); pil.position.set(0, DECK_Y - 30.8, z); pil.castShadow = true; scene.add(pil);
  const cap = new THREE.Mesh(new RoundedBoxGeometry(ROAD_W + 2, 1.4, 3, 2, .2), mat(0xc4beb5, .9)); cap.position.set(0, DECK_Y - 1.4, z); scene.add(cap);
}

// ---- the city below: blocks with lit windows and rooftop water tanks, a temple, palms, a river of light
const GROUND = -38;
const ground = new THREE.Mesh(new THREE.PlaneGeometry(1600, 1600), mat(0x2c3a62, 1)); ground.rotation.x = -Math.PI / 2; ground.position.y = GROUND; scene.add(ground);
function windowTex(base, lit) {
  const c = document.createElement('canvas'); c.width = 64; c.height = 128; const g = c.getContext('2d');
  g.fillStyle = base; g.fillRect(0, 0, 64, 128);
  for (let y = 6; y < 128; y += 14) for (let x = 5; x < 64; x += 12) { g.fillStyle = Math.random() < lit ? '#ffd58a' : 'rgba(30,40,70,.55)'; g.fillRect(x, y, 7, 8); }
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.wrapS = t.wrapT = THREE.RepeatWrapping; return t;
}
const WALLS = ['#6f86b8', '#8d9ccc', '#5f74a6', '#a58fb8', '#7f95c4', '#c49a8a'];
const towerMats = WALLS.map((w) => { const t = windowTex(w, .28); return new THREE.MeshStandardMaterial({ map: t, emissiveMap: t, emissive: 0xffc070, emissiveIntensity: .22, roughness: .85 }); });
const boxG = new THREE.BoxGeometry(1, 1, 1);
let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
for (let i = 0; i < 520; i++) {
  const side = rnd() < .5 ? -1 : 1, x = side * (16 + rnd() * 150), z = 40 - rnd() * 420;
  const w = 6 + rnd() * 10, d = 6 + rnd() * 10, h = 6 + Math.pow(rnd(), 1.6) * 26;   // roofs stay below the deck
  const m = new THREE.Mesh(boxG, towerMats[i % towerMats.length]); m.scale.set(w, h, d); m.position.set(x, GROUND + h / 2, z);
  m.material.map.repeat.set(Math.max(1, Math.round(w / 3)), Math.max(1, Math.round(h / 6))); scene.add(m);
  if (rnd() < .45) { const tk = new THREE.Mesh(new THREE.CylinderGeometry(.9, .9, 1.4, 10), mat(0x2b2b33, .6)); tk.position.set(x + (rnd() - .5) * w * .5, GROUND + h + .7, z); scene.add(tk); }
}
function gopuram(x, z, k) {
  const g = new THREE.Group(); let y = 0;
  for (let i = 0; i < 7; i++) { const w = (9 - i * 1.15) * k, s = new THREE.Mesh(new RoundedBoxGeometry(w, 2.2 * k, w * .6, 2, .2), mat(i % 2 ? 0xe9a15b : 0xf2b56e, .8)); s.position.y = y + 1.1 * k; s.castShadow = true; g.add(s); y += 2.2 * k; }
  const top = new THREE.Mesh(new THREE.SphereGeometry(.8 * k, 14, 10), mat(0xffcf3f, .3, { metalness: .5, emissive: 0xff9a20, emissiveIntensity: .4 })); top.position.y = y + .6 * k; g.add(top);
  g.position.set(x, GROUND, z); scene.add(g);
}
gopuram(-46, -150, 2.2); gopuram(70, -260, 2.6);
for (let i = 0; i < 70; i++) {
  const x = (rnd() < .5 ? -1 : 1) * (18 + rnd() * 60), z = 0 - rnd() * 300, g = new THREE.Group();
  const tr = new THREE.Mesh(new THREE.CylinderGeometry(.3, .4, 9, 6), mat(0x8a6a48)); tr.position.y = 4.5; g.add(tr);
  for (let k = 0; k < 6; k++) { const l = new THREE.Mesh(new THREE.SphereGeometry(1, 8, 5), mat(0x3f7a44, .9)); l.scale.set(3, .3, .8); const a = k / 6 * Math.PI * 2; l.position.set(Math.cos(a) * 2, 8.8, Math.sin(a) * 2); l.rotation.y = -a; l.rotation.z = -.3; g.add(l); }
  g.position.set(x, GROUND, z); scene.add(g);
}
const river = new THREE.Mesh(new THREE.PlaneGeometry(40, 1600), mat(0xffb36b, .15, { metalness: .4, emissive: 0xff8a3a, emissiveIntensity: .25 })); river.rotation.x = -Math.PI / 2; river.rotation.z = .5; river.position.set(-90, GROUND + .05, -200); scene.add(river);

// ---- gates: two glowing arches across the lanes
function labelTex(text, bg) {
  const c = document.createElement('canvas'); c.width = 256; c.height = 160; const g = c.getContext('2d');
  g.fillStyle = bg; g.beginPath(); g.roundRect(0, 0, 256, 160, 40); g.fill();
  g.fillStyle = '#fff'; g.font = '110px "Lilita One", Arial Black'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(text, 128, 84);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}
function gate(x, col, lab, z) {
  const g = new THREE.Group(), c = new THREE.Color(col), w = 3.05;
  for (const sx of [-1, 1]) { const p = new THREE.Mesh(new RoundedBoxGeometry(.3, 3.4, .3, 2, .1), mat(c, .3, { emissive: c, emissiveIntensity: .5 })); p.position.set(sx * w / 2, 1.7, 0); p.castShadow = true; g.add(p); }
  const top = new THREE.Mesh(new RoundedBoxGeometry(w + .3, .3, .3, 2, .1), mat(c, .3, { emissive: c, emissiveIntensity: .5 })); top.position.y = 3.4; g.add(top);
  const glass = new THREE.Mesh(new THREE.PlaneGeometry(w - .2, 3.2), new THREE.MeshBasicMaterial({ color: c, transparent: true, opacity: .28, side: THREE.DoubleSide, depthWrite: false })); glass.position.y = 1.7; g.add(glass);
  const plate = new THREE.Mesh(new THREE.PlaneGeometry(1.5, .94), new THREE.MeshBasicMaterial({ map: labelTex(lab, '#' + c.getHexString()), toneMapped: false })); plate.position.set(0, 4.2, 0); g.add(plate);
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(w, 1.4), new THREE.MeshBasicMaterial({ color: c, transparent: true, opacity: .45 })); floor.rotation.x = -Math.PI / 2; floor.position.set(0, .03, .8); g.add(floor);
  g.position.set(x, DECK_Y, z); scene.add(g);
}
gate(-1.6, 0x1cb0f6, 'A', -9); gate(1.6, 0x58cc02, 'B', -9);

// ---- the batch: 12 students in neat rows
const SKIN = [0xc98e62, 0xb57a52, 0xd9a27a, 0xa86d47, 0xc08458], HAIRC = [0x4a2e1c, 0x5a3622, 0x3a2416];
const shirtG = new THREE.LatheGeometry([[0, 0], [.26, 0], [.29, .12], [.3, .42], [.27, .6], [.16, .7], [0, .72]].map((q) => new THREE.Vector2(q[0], q[1])), 16);
function student(i) {
  // chibi student: big head, short body, own shirt colour, hair style and bag, so the batch reads at a glance
  const g = new THREE.Group(), limbs = [];
  const SH = [0xffffff, 0xf4d35e, 0x7cc6fe, 0xff8fa3, 0xb8e986, 0xffb26b][i % 6], PANT = [0x2b3a67, 0x3d405b, 0x22223b][i % 3];
  const skin = mat(SKIN[i % 5], .6), hair = mat(HAIRC[i % 3], .28), shirtM = mat(SH, .6), pantM = mat(PANT, .7);
  const girl = i % 2 === 1;
  for (const sx of [-1, 1]) {
    const leg = new THREE.Group(); leg.position.set(sx * .13, .5, 0);
    const l = new THREE.Mesh(new THREE.CapsuleGeometry(.11, .26, 4, 10), girl ? skin : pantM); l.position.y = -.2; leg.add(l);
    const s = new THREE.Mesh(new RoundedBoxGeometry(.2, .13, .32, 2, .06), mat(0xf5f5f5, .5)); s.position.set(0, -.42, -.05); leg.add(s);
    leg.traverse((m) => (m.castShadow = true)); g.add(leg); limbs.push(leg);
  }
  const body = new THREE.Mesh(new RoundedBoxGeometry(.5, .5, .34, 4, .14), shirtM); body.position.y = .76; body.castShadow = true; g.add(body);
  if (girl) { const sk = new THREE.Mesh(new THREE.CylinderGeometry(.2, .32, .26, 16), pantM); sk.position.y = .5; g.add(sk); }
  const bag = new THREE.Mesh(new RoundedBoxGeometry(.42, .44, .2, 3, .08), mat([0x2f6bff, 0xff5a36, 0x7c4dff, 0x16a34a][i % 4], .45)); bag.position.set(0, .82, .25); bag.castShadow = true; g.add(bag);
  const flap = new THREE.Mesh(new RoundedBoxGeometry(.38, .16, .06, 2, .03), mat(0xffffff, .5)); flap.position.set(0, .72, .36); g.add(flap);
  for (const sx of [-1, 1]) {
    const arm = new THREE.Group(); arm.position.set(sx * .3, .95, 0);
    const sl = new THREE.Mesh(new THREE.CapsuleGeometry(.09, .12, 4, 10), shirtM); sl.position.y = -.08; arm.add(sl);
    const fo = new THREE.Mesh(new THREE.SphereGeometry(.085, 12, 10), skin); fo.position.y = -.26; arm.add(fo);
    arm.rotation.z = sx * .18; g.add(arm); limbs.push(arm);
  }
  const head = new THREE.Mesh(new THREE.SphereGeometry(.3, 26, 20), skin); head.position.y = 1.3; head.castShadow = true; g.add(head);
  for (const sx of [-1, 1]) { const e = new THREE.Mesh(new THREE.SphereGeometry(.07, 10, 8), skin); e.position.set(sx * .33, 1.3, 0); g.add(e); }
  const cap = new THREE.Mesh(new THREE.SphereGeometry(.32, 26, 14, 0, Math.PI * 2, 0, Math.PI * .5), hair); cap.position.y = 1.33; cap.rotation.x = .3; g.add(cap);
  if (girl) {
    const br = new THREE.Mesh(new THREE.CapsuleGeometry(.08, .4, 4, 10), hair); br.position.set(0, 1.0, .3); br.rotation.x = .35; g.add(br);
    const bow = new THREE.Mesh(new THREE.SphereGeometry(.07, 10, 8), mat(0xff4d6d, .4)); bow.position.set(0, 1.25, .36); g.add(bow);
  } else if (i % 4 === 0) {
    const tuft = new THREE.Mesh(new THREE.ConeGeometry(.12, .2, 8), hair); tuft.position.set(.05, 1.7, -.05); tuft.rotation.z = -.4; g.add(tuft);
  }
  g.userData = { limbs, ph: i * 1.7 }; return g;
}
const crowd = [];
[[3, 0], [4, .95], [5, 1.9]].forEach(([n, z], r) => { for (let i = 0; i < n; i++) { const s = student(crowd.length); s.position.set((i - (n - 1) / 2) * .9, DECK_Y, 9 + z * .95); s.scale.setScalar(1.05); scene.add(s); crowd.push(s); } });

// ---- a few sparks drifting off the gates (the only busy thing on screen)
const sparkG = new THREE.BufferGeometry(), N = 90, pos = new Float32Array(N * 3), vel = [];
for (let i = 0; i < N; i++) { pos[i * 3] = (Math.random() - .5) * 6; pos[i * 3 + 1] = Math.random() * 4; pos[i * 3 + 2] = -9 + Math.random(); vel.push(Math.random() * .6 + .2); }
sparkG.setAttribute('position', new THREE.BufferAttribute(pos, 3));
const sparks = new THREE.Points(sparkG, new THREE.PointsMaterial({ color: 0xfff1c4, size: .12, transparent: true, opacity: .85, depthWrite: false }));
scene.add(sparks);

// ---- render with bloom so the gates and windows glow
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, cam));
const bloom = new UnrealBloomPass(new THREE.Vector2(1, 1), .55, .5, .82); composer.addPass(bloom);
composer.addPass(new OutputPass());
function resize() { const w = cv.clientWidth, h = cv.clientHeight; renderer.setSize(w, h, false); composer.setSize(w, h); cam.aspect = w / h; cam.updateProjectionMatrix(); }
addEventListener('resize', resize); resize();
// high camera looking down the road
cam.position.set(0, 13, 26); cam.lookAt(0, 0, -8);
const clock = new THREE.Clock();
function frame() {
  const t = clock.getElapsedTime();
  for (const s of crowd) { const ph = t * 9 + s.userData.ph, L = s.userData.limbs; L[0].rotation.x = Math.sin(ph) * .75; L[1].rotation.x = -Math.sin(ph) * .75; L[2].rotation.x = -Math.sin(ph) * .7; L[3].rotation.x = Math.sin(ph) * .7; s.position.y = Math.abs(Math.sin(ph)) * .08; }
  const p = sparkG.attributes.position.array; for (let i = 0; i < N; i++) { p[i * 3 + 1] += vel[i] * .03; if (p[i * 3 + 1] > 5) p[i * 3 + 1] = 0; } sparkG.attributes.position.needsUpdate = true;
  composer.render(); requestAnimationFrame(frame);
}
frame();
</script></body></html>
