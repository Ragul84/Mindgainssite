<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#14213d"><link rel="manifest" href="manifest.webmanifest">
<!-- Optional runtime config. A missing config.js is fine: the game then uses its local question bank. -->
<script src="config.js"></script>
<title>Cut-Off Run</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@700;800;900&display=swap">
<style>
/* Layout: one portrait game column; canvas world + DOM HUD + bottom sheets + overlay cards. One bright arcade look for both themes. */
:root{
  --ink:#14213d; --saffron:#ff8a1f; --good:#3ddc84; --bad:#ff4d5e; --gold:#ffd23f; --omr:#d6336c; --blue:#2f6bff;
  --panel:#101a33; --paper:#ffffff; --mist:#eef3fc; --line:#d3ddf0; --muted:#5a6b8c;
  --display:"Lilita One","Arial Black",system-ui,sans-serif;
  --body:"Nunito",system-ui,-apple-system,sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%;overscroll-behavior:none}
body{background:#06132b;color:var(--paper);font-family:var(--body);overflow:hidden;
  padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
#wrap{position:relative;height:100%;max-width:480px;margin:0 auto;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
canvas{display:block;width:100%;height:100%}
button{font-family:inherit}
/* HUD */
.hud{position:absolute;left:0;right:0;top:0;padding:10px 14px 0;display:flex;flex-direction:column;gap:6px;pointer-events:none}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.lvl{font-family:var(--display);font-size:19px;background:linear-gradient(#ff9d3c,#f2601a);padding:3px 12px;border-radius:10px;border:3px solid var(--ink);text-shadow:0 2px 0 var(--ink);white-space:nowrap}
.bar{flex:1;height:14px;background:var(--panel);border:3px solid var(--ink);border-radius:10px;overflow:hidden;min-width:40px}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold),var(--saffron))}
.marks{display:flex;align-items:center;gap:6px;background:var(--panel);border:3px solid var(--ink);border-radius:20px;padding:2px 12px 2px 4px;font-family:var(--display);font-size:18px;font-variant-numeric:tabular-nums;white-space:nowrap}
.coin{width:22px;height:22px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff3a0,#ffc400 55%,#c98a00);border:2px solid #8a5d00;display:inline-block;flex:none}
.row2{display:flex;justify-content:space-between;align-items:center;gap:6px}
.pups{display:flex;gap:5px;flex-wrap:wrap}
.pup{font-family:var(--display);font-size:13px;padding:2px 8px;border-radius:9px;border:2px solid var(--ink);color:#fff;white-space:nowrap}
.need{font-family:var(--display);font-size:14px;background:#c0283a;border:3px solid var(--ink);border-radius:10px;padding:2px 10px;white-space:nowrap;transition:background .2s;margin-left:auto}
.need.ok{background:#1f9e5a}
/* OMR question card */
.q{position:absolute;left:18px;right:18px;color:var(--ink);background:#fff;border:3px solid var(--ink);border-radius:6px;padding:0 0 10px;box-shadow:0 6px 0 var(--ink),0 10px 24px rgba(0,0,0,.25);pointer-events:none;
  background-image:repeating-linear-gradient(0deg,transparent 0 23px,rgba(214,51,108,.08) 23px 24px);transform-origin:50% 0;animation:qin .35s cubic-bezier(.2,1.6,.4,1)}
@keyframes qin{from{transform:translateY(-14px) rotate(-3deg) scale(.85);opacity:0}to{transform:none}}
.q.out{transition:transform .3s,opacity .3s;transform:translateY(-20px) scale(.9);opacity:0}
.qh{display:flex;align-items:center;gap:8px;background:var(--omr);color:#fff;padding:4px 10px;font-family:var(--display);font-size:13px;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.qh .tm{flex:1;height:7px;background:rgba(255,255,255,.35);border-radius:4px;overflow:hidden;min-width:20px}.qh .tm b{display:block;height:100%;background:#fff;width:100%}
#qt{display:block;font-weight:900;font-size:19px;line-height:1.22;padding:8px 12px 6px;text-align:left;text-wrap:balance;white-space:pre-line}
#qt small{display:block;font-size:13px;color:var(--omr);font-weight:900;text-transform:uppercase;letter-spacing:.04em}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:0 10px}
.opt{display:flex;align-items:center;gap:6px;border:2px dashed rgba(214,51,108,.45);border-radius:10px;padding:6px 7px;font-weight:900;font-size:15px;line-height:1.15;min-width:0;transition:background .15s,border-color .15s,transform .15s}
.opt span{min-width:0;overflow-wrap:break-word}
.opts.n3 .opt{flex-direction:column;align-items:flex-start;gap:3px;font-size:14px;padding:5px 6px}
.bub{flex:none;width:22px;height:22px;border-radius:50%;border:2px solid var(--omr);color:var(--omr);display:grid;place-items:center;font-family:var(--display);font-size:12px;font-style:normal;transition:background .2s,color .2s}
.opt.on{border-style:solid;border-color:var(--blue);background:#eaf2ff;transform:scale(1.04)}
.opt.on .bub{border-color:var(--blue);color:var(--blue)}
.opt.fill .bub{background:#1b1b1b;border-color:#1b1b1b;color:#1b1b1b}
.opt.ok{border:2px solid var(--good);background:#e5fbef}.opt.no{border:2px solid var(--bad);background:#ffeef0}
.stamp{position:absolute;right:-6px;top:-18px;font-family:var(--display);font-size:26px;padding:2px 10px;border:3px solid currentColor;border-radius:8px;transform:rotate(-12deg) scale(0);transition:transform .2s cubic-bezier(.2,1.8,.4,1);background:rgba(255,255,255,.95)}
.stamp.show{transform:rotate(-12deg) scale(1)}
.lock{pointer-events:auto;display:block;margin:8px 10px 0;width:calc(100% - 20px);font-family:var(--display);font-size:17px;color:#fff;background:linear-gradient(#5aa8ff,#2f6bff);border:3px solid var(--ink);border-radius:12px;padding:6px;box-shadow:0 3px 0 var(--ink);cursor:pointer;text-shadow:0 1px 0 rgba(0,0,0,.3)}
.lock:disabled{background:#6b7a99;cursor:default}
.qbtns{display:flex;gap:6px;margin:8px 10px 0}.qbtns .lock{margin:0;width:auto;flex:1}.lock.skip{flex:0 0 auto;background:linear-gradient(#c4ccdb,#8a95a8);padding:6px 14px}
.why{margin:8px 10px 0;padding:6px 9px;border-radius:9px;background:#fff7d6;border:2px solid #f2c94c;font-weight:800;font-size:13.5px;line-height:1.3;color:var(--ink)}.why b{color:#b07800}.why span{color:var(--muted);font-size:12px}
.opts.n4{grid-template-columns:1fr 1fr!important}.opts.n4 .opt{font-size:14px;padding:5px 7px}
.big .q #qt{font-size:22px}.big .opt{font-size:17px}.big .why{font-size:15px}.big .sheet .sq{font-size:21px}
.lock:focus-visible{outline:3px solid var(--saffron);outline-offset:2px}
/* banner */
.banner{position:absolute;left:12px;right:12px;top:47%;text-align:center;pointer-events:none;font-family:var(--display);font-size:34px;line-height:1.05;color:#fff;text-shadow:0 3px 0 var(--ink),0 0 2px var(--ink),3px 0 0 var(--ink),-3px 0 0 var(--ink),0 -3px 0 var(--ink);opacity:0;transform:scale(.8);transition:opacity .25s,transform .25s}
.banner small{display:block;font-size:17px;margin-top:6px;color:var(--gold)}
.banner.show{opacity:1;transform:scale(1)}
/* bottom sheet (boss, interview, raid, mains) */
.sheet{position:absolute;left:12px;right:12px;bottom:14px;background:#fff;color:var(--ink);border:4px solid var(--ink);border-radius:20px;box-shadow:0 6px 0 var(--ink);padding:12px;display:flex;flex-direction:column;gap:10px;animation:up .3s cubic-bezier(.2,1.4,.4,1)}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none}}
.sheet .st{display:flex;align-items:center;gap:8px;font-family:var(--display);font-size:15px;letter-spacing:.05em;text-transform:uppercase}
.sheet .st b{font-weight:400;color:#fff;background:var(--ink);padding:2px 8px;border-radius:7px}
.sheet .tm{flex:1;height:9px;border-radius:5px;background:var(--line);overflow:hidden;min-width:20px}.sheet .tm i{display:block;height:100%;width:100%;background:var(--saffron)}
.sheet .sq{font-weight:900;font-size:19px;line-height:1.25;white-space:pre-line}
.sheet .sb{display:grid;gap:8px}
.ans{font-family:var(--display);font-size:18px;line-height:1.1;color:var(--ink);background:var(--mist);border:3px solid var(--ink);border-radius:14px;padding:12px 8px;cursor:pointer;box-shadow:0 4px 0 var(--ink);overflow-wrap:anywhere}
.ans:active{transform:translateY(2px);box-shadow:0 2px 0 var(--ink)}
.ans.ok{background:#c9f7dc}.ans.no{background:#ffd3d8}
.ans:focus-visible{outline:3px solid var(--saffron);outline-offset:2px}
.sheet .fb{font-weight:900;font-size:14px;min-height:18px}
/* mains rhythm */
.mlane{position:relative;height:46px;border:3px solid var(--ink);border-radius:12px;background:repeating-linear-gradient(90deg,#fff 0 18px,#f6f8fd 18px 19px);overflow:hidden}
.mzone{position:absolute;top:0;bottom:0;background:rgba(61,220,132,.35);border-left:3px solid var(--good);border-right:3px solid var(--good)}
.mzone i{position:absolute;top:0;bottom:0;left:30%;right:30%;background:rgba(61,220,132,.55)}
.mpen{position:absolute;top:-2px;width:6px;height:50px;background:var(--ink);border-radius:3px;transform:translateX(-3px)}
.mpen:after{content:"";position:absolute;left:-5px;bottom:-1px;border:8px solid transparent;border-top-color:var(--saffron)}
.kw{font-family:var(--display);font-size:22px;color:var(--blue)}
/* overlays */
.ov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:18px 14px;background:rgba(6,19,43,.76);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.card{width:100%;max-width:420px;max-height:100%;overflow:auto;background:var(--paper);color:var(--ink);border:4px solid var(--ink);border-radius:22px;padding:18px 16px;box-shadow:0 8px 0 var(--ink);display:flex;flex-direction:column;gap:12px}
.card h1{font-family:var(--display);font-weight:400;font-size:46px;line-height:1;margin:0;color:var(--saffron);text-shadow:0 3px 0 var(--ink)}
.card h2{font-family:var(--display);font-weight:400;font-size:30px;margin:0;line-height:1.05;text-wrap:balance}
.card h3{font-family:var(--display);font-weight:400;font-size:19px;margin:0}
.card p{margin:0;font-weight:700;line-height:1.45}
.eyebrow{font-family:var(--display);font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.btn{pointer-events:auto;font-family:var(--display);font-size:24px;color:#fff;background:linear-gradient(#5ee89a,#22b866);border:4px solid var(--ink);border-radius:16px;padding:10px;cursor:pointer;box-shadow:0 5px 0 var(--ink);text-shadow:0 2px 0 rgba(0,0,0,.35)}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--ink)}
.btn:focus-visible{outline:3px solid var(--saffron);outline-offset:3px}
.btn.alt{background:linear-gradient(#ffb35c,#f2601a);font-size:19px}
.btn.blue{background:linear-gradient(#5aa8ff,#2f6bff);font-size:19px}
.btn.pink{background:linear-gradient(#ff7aa8,#d6336c);font-size:19px}
.btn.sm{font-size:16px;padding:7px;border-width:3px;box-shadow:0 3px 0 var(--ink)}
.btn:disabled{filter:grayscale(1);opacity:.55;cursor:default}
.bgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.stats div{background:var(--mist);border:2px solid var(--line);border-radius:12px;padding:8px 4px}
.stats b{display:block;font-family:var(--display);font-size:22px;font-weight:400;font-variant-numeric:tabular-nums}
.stats small{font-size:11px;font-weight:900;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.rev{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.rev li{font-size:14px;font-weight:700;line-height:1.35;padding:7px 10px;border-radius:10px;background:var(--mist);border-left:5px solid var(--good);white-space:pre-line}
.rev li.w{border-left-color:var(--bad);background:#fff0f1}
.rev li em{font-style:normal;font-weight:900}
.rev li s{color:#a33}
.service{font-family:var(--display);font-size:16px;color:#fff;background:var(--ink);border-radius:10px;padding:6px 12px;align-self:flex-start}
.how{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;font-weight:800;font-size:14px;align-items:center}
.how span{font-family:var(--display);width:26px;height:26px;border-radius:8px;display:grid;place-items:center;color:#fff;border:2px solid var(--ink);font-size:13px}
.streak{font-family:var(--display);font-size:15px;color:var(--saffron)}
/* town */
.townsvg{width:100%;height:auto;border:3px solid var(--ink);border-radius:16px;display:block;background:#bfe9ff}
.town{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.bld{background:var(--mist);border:3px solid var(--line);border-radius:14px;padding:9px;display:flex;flex-direction:column;gap:5px;min-width:0}
.bld b{font-family:var(--display);font-weight:400;font-size:16px;line-height:1.1}
.bld small{font-size:12px;font-weight:800;color:var(--muted);line-height:1.3}
.pips{display:flex;gap:3px}.pips i{flex:1;height:6px;border-radius:3px;background:var(--line)}.pips i.on{background:var(--saffron)}
.bld .btn{margin-top:auto;font-size:15px;padding:6px;border-width:3px;box-shadow:0 3px 0 var(--ink);display:flex;align-items:center;justify-content:center;gap:5px}
.bld .btn .coin{width:16px;height:16px}
.bankrow{display:flex;align-items:center;gap:8px;font-family:var(--display);font-size:22px}
/* fact cards */
.fgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.fc{min-height:140px;max-width:100%;border-radius:12px;border:3px solid var(--ink);padding:7px;display:flex;flex-direction:column;gap:4px;font-size:11px;font-weight:800;line-height:1.25;min-width:0;overflow:hidden;position:relative}
.fc b{font-family:var(--display);font-weight:400;font-size:13px;line-height:1.05}
.fc .ico{font-size:22px;line-height:1}
.fc.lock{background:#dfe6f3;color:#8a96ad;border-style:dashed;align-items:center;justify-content:center;text-align:center}
.fc .new{position:absolute;right:4px;top:4px;background:var(--bad);color:#fff;font-family:var(--display);font-size:10px;padding:1px 5px;border-radius:6px}
.setrow{display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:900;font-size:13px}
.setrow i{font-style:normal;color:var(--muted);font-weight:800}
.setrow.done i{color:#1f9e5a}
.reveal{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.reveal .fc{width:104px;animation:flip .5s both}
@keyframes flip{from{transform:perspective(600px) rotateY(90deg) scale(.8)}to{transform:none}}
/* mascot + new screens */
.card>*{flex-shrink:0}
.card,.sheet{color-scheme:light}
.miga{display:block;width:132px;height:auto;flex:none;transform-origin:50% 100%;animation:bob 2.4s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-6px) rotate(2deg)}}
.m-cheer{animation:hop .6s ease-in-out infinite}@keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
.m-sad{animation:sway 3s ease-in-out infinite}@keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
.bubble{position:relative;background:#fff;color:var(--ink);border:3px solid var(--ink);border-radius:16px;padding:8px 12px;font-weight:900;font-size:15px;line-height:1.25;max-width:210px;box-shadow:0 3px 0 var(--ink);text-align:left;text-wrap:balance}
.bubble.r:after,.bubble.l:after{content:"";position:absolute;bottom:14px;border:9px solid transparent}
.bubble.r:after{right:-18px;border-left-color:var(--ink)}.bubble.l:after{left:-18px;border-right-color:var(--ink)}
.stage{position:relative;display:flex;align-items:flex-end;justify-content:center;gap:4px;padding:14px 10px 0;border:3px solid var(--ink);border-radius:18px;overflow:hidden;background:linear-gradient(#56cdfc,#bdeeff 70%,#7fd68a 70%)}
.stage .bubble{margin-bottom:64px;z-index:1}
.stage .miga{z-index:1}
.stage.win{background:linear-gradient(#ffe27a,#ffb347 72%,#ff8a1f 72%)}
.stage.lose{background:linear-gradient(#9fb4d8,#cfd9ec 72%,#8fa3c7 72%)}
.rays{position:absolute;left:50%;top:60%;width:640px;height:640px;margin:-320px 0 0 -320px;background:repeating-conic-gradient(rgba(255,255,255,.4) 0 10deg,transparent 10deg 20deg);animation:spin 14s linear infinite;pointer-events:none}
@keyframes spin{to{transform:rotate(360deg)}}
.ttl{font-family:var(--display);font-size:42px;line-height:1;color:var(--saffron);text-shadow:0 3px 0 var(--ink);text-align:center;margin:0}
.sub{text-align:center;font-family:var(--display);font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.btn.big{font-size:28px;padding:12px}
.dock{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.dock.d4{grid-template-columns:repeat(4,1fr)}
.tile{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;font-family:var(--display);font-size:13px;color:var(--ink);background:var(--mist);border:3px solid var(--ink);border-radius:14px;padding:8px 2px 6px;box-shadow:0 3px 0 var(--ink);cursor:pointer;min-width:0}
.tile:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.tile:focus-visible{outline:3px solid var(--saffron);outline-offset:2px}
.tile svg{width:30px;height:30px}
.tile .badge{position:absolute;top:-8px;right:-6px;background:var(--bad);color:#fff;border:2px solid var(--ink);border-radius:10px;font-size:11px;padding:0 6px}
.rhead{text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px}
.air{font-family:var(--display);font-size:54px;line-height:1;margin:0}
.btn.gold{background:linear-gradient(#ffe066,#f2a900);color:var(--ink);text-shadow:none;font-size:20px;animation:glow 1.2s ease-in-out infinite}
@keyframes glow{0%,100%{box-shadow:0 5px 0 var(--ink),0 0 0 0 rgba(255,210,63,.7)}50%{box-shadow:0 5px 0 var(--ink),0 0 0 10px rgba(255,210,63,0)}}
.tabs{display:flex;gap:6px;background:var(--mist);padding:4px;border-radius:12px}
.tabs button{flex:1;font-family:var(--display);font-size:15px;border:0;background:transparent;color:var(--muted);padding:8px;border-radius:9px;cursor:pointer}
.tabs button.on{background:#fff;color:var(--ink);box-shadow:0 2px 0 var(--line)}
.more{font-family:var(--display);font-size:14px;background:none;border:0;color:var(--blue);cursor:pointer;padding:4px;align-self:center}
.packbox{width:150px;height:196px;border:4px solid var(--ink);border-radius:18px;background:linear-gradient(135deg,#ff8a1f,#d6336c);display:grid;place-items:center;font-family:var(--display);font-size:26px;color:#fff;text-shadow:0 2px 0 var(--ink);box-shadow:0 6px 0 var(--ink);cursor:pointer;animation:shake 1.1s ease-in-out infinite;position:relative;overflow:hidden}
.packbox:before{content:"";position:absolute;left:0;right:0;top:34px;border-top:4px dashed rgba(255,255,255,.7)}
.packbox.tear{animation:tear .45s forwards}
@keyframes shake{0%,100%{transform:rotate(0)}20%{transform:rotate(-4deg)}40%{transform:rotate(4deg)}60%{transform:rotate(-2deg)}80%{transform:rotate(2deg)}}
@keyframes tear{to{transform:scale(1.5) rotate(8deg);opacity:0}}
.pstage{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
.bigcard{width:min(250px,72vw);min-height:290px;border:4px solid var(--ink);border-radius:20px;padding:16px 14px;display:flex;flex-direction:column;gap:10px;align-items:center;text-align:center;box-shadow:0 6px 0 var(--ink);animation:flip .5s both;cursor:pointer}
.bigcard .ico{font-size:56px;line-height:1}
.bigcard b{font-family:var(--display);font-weight:400;font-size:24px;line-height:1.05}
.bigcard p{font-size:15px;font-weight:800;line-height:1.35;margin:0}
.setpill{font-family:var(--display);font-size:12px;letter-spacing:.06em;text-transform:uppercase;background:var(--ink);color:#fff;padding:3px 9px;border-radius:8px}
.newtag{font-family:var(--display);font-size:13px;color:#fff;background:var(--bad);border:2px solid var(--ink);padding:1px 9px;border-radius:8px}
.dots{display:flex;gap:6px}.dots i{width:9px;height:9px;border-radius:50%;background:var(--line)}.dots i.on{background:var(--saffron)}
.podium{display:grid;grid-template-columns:1fr 1fr 1fr;align-items:end;gap:6px;text-align:center}
.pod{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.pod .av{width:46px;height:46px;border-radius:50%;border:3px solid var(--ink);display:grid;place-items:center;font-family:var(--display);font-size:20px;color:#fff}
.pod .nm{font-weight:900;font-size:13px;line-height:1.1;overflow-wrap:anywhere}
.pod .sc{font-size:12px;font-weight:800;color:var(--muted);font-variant-numeric:tabular-nums}
.pod .st{width:100%;border:3px solid var(--ink);border-bottom:0;border-radius:10px 10px 0 0;font-family:var(--display);font-size:24px;color:#fff;display:grid;place-items:center;text-shadow:0 2px 0 var(--ink)}
.pod.me .av{outline:3px solid var(--gold);outline-offset:2px}
.sets{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.settile{border:3px solid var(--ink);border-radius:16px;padding:12px 8px;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;box-shadow:0 4px 0 var(--ink);font-family:var(--display);font-size:15px;color:var(--ink);text-align:center;min-width:0}
.settile small{font-family:var(--body);font-weight:800;font-size:11px;line-height:1.25;color:var(--muted)}
.settile.done small{color:#1f9e5a}
.ring{width:64px;height:64px}
.cgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cgrid .fc{min-height:150px;font-size:12px}
.brow{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;background:var(--mist);border-radius:14px;padding:8px}
.brow .sw{width:44px;height:44px;border:3px solid var(--ink);border-radius:12px;display:grid;place-items:center;font-family:var(--display);font-size:18px;color:#fff;text-shadow:0 2px 0 var(--ink)}
.brow b{font-family:var(--display);font-weight:400;font-size:16px;display:block}
.brow small{font-size:12px;font-weight:800;color:var(--muted);line-height:1.25;display:block}
.brow .btn{font-size:15px;padding:6px 10px;border-width:3px;box-shadow:0 3px 0 var(--ink);display:flex;align-items:center;gap:5px;white-space:nowrap}
.brow .btn .coin{width:16px;height:16px}
.toast{position:absolute;left:8px;bottom:12px;display:flex;align-items:flex-end;gap:2px;pointer-events:none;transform:translateX(-130%);transition:transform .35s cubic-bezier(.2,1.4,.4,1);z-index:2;max-width:calc(100% - 16px)}
.toast.show{transform:none}
.toast .miga{width:74px;animation:none}
.toast .bubble{font-size:13px;margin-bottom:30px;max-width:200px}
.hdr{display:flex;align-items:center;justify-content:space-between;gap:8px}
.x{font-family:var(--display);font-size:16px;background:var(--mist);border:3px solid var(--ink);border-radius:10px;padding:4px 10px;cursor:pointer;color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.chip{font-family:var(--display);font-size:13px;padding:3px 10px;border-radius:999px;border:2px solid var(--ink);background:var(--mist);color:var(--ink);white-space:nowrap}
.chip.fire{background:#ffe2c2}.chip.theme{background:#efe0ff}.chip.due{background:#ffe3e8}
.dock.d4{grid-template-columns:repeat(4,1fr)}.dock.d5{grid-template-columns:repeat(5,1fr)}.dock.d5 .tile{font-size:12px}
.mtop{display:flex;justify-content:center;gap:6px;min-height:24px}
.btn.big small{display:block;font-family:var(--body);font-size:13px;font-weight:700;opacity:.85;margin-top:2px;letter-spacing:0}
.mlist{display:flex;flex-direction:column;gap:8px}.mlist .btn{display:flex;align-items:center;gap:10px;justify-content:flex-start;text-align:left}.mlist .btn svg{width:26px;height:26px;flex:none}
.ov.mapov{display:flex;flex-direction:column;align-items:stretch;justify-content:flex-start;padding:0;background:#6ec3ee;backdrop-filter:none;-webkit-backdrop-filter:none;z-index:5}
.mbar2{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--paper);border-bottom:4px solid var(--ink);z-index:3;color:var(--ink)}
.mtl{flex:1;display:flex;flex-direction:column;line-height:1.1}.mtl b{font-family:var(--display);font-size:20px}.mtl small{font-size:12px;font-weight:700;color:var(--muted)}
.mscroll{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;position:relative;touch-action:pan-y}
.mworld{position:relative;margin:0 auto;max-width:480px}.mworld svg.mbg{position:absolute;left:0;top:0;display:block}
.mnd{position:absolute;transform:translate(-50%,-50%);width:58px;height:58px;border-radius:50%;border:4px solid var(--ink);font-family:var(--display);font-size:24px;color:#fff;text-shadow:0 2px 0 var(--ink);box-shadow:0 5px 0 var(--ink);display:flex;align-items:center;justify-content:center;padding:0;cursor:pointer;z-index:1}
.mnd.done{background:radial-gradient(circle at 35% 30%,#fff6b8,#ffc21a 58%,#d98f00)}
.mnd.cur{background:radial-gradient(circle at 35% 30%,#ffd9b0,#ff8a1f 58%,#d95a00);animation:mpulse 1.3s infinite}
.mnd.lock{background:radial-gradient(circle at 35% 30%,#e3e8f0,#aab4c5);color:#5d6884;text-shadow:none;font-size:20px}
.mnd.boss{width:72px;height:72px;font-size:28px}.mnd.boss.lock{font-size:22px}
.mnd svg.lk{width:22px;height:22px}
.mnd .bt{position:absolute;top:-15px;left:50%;transform:translateX(-50%);font-size:11px;letter-spacing:.06em;color:#fff;border:2px solid var(--ink);border-radius:8px;padding:0 6px;text-shadow:none;white-space:nowrap;line-height:16px}
.mnd .ms{position:absolute;bottom:-17px;left:50%;transform:translateX(-50%);display:flex;gap:0;font-size:17px;line-height:1;text-shadow:0 2px 0 var(--ink)}
.mnd .ms span{color:#c9d1de}.mnd .ms span.on{color:#ffd23f}
@keyframes mpulse{0%,100%{box-shadow:0 5px 0 var(--ink),0 0 0 0 rgba(255,138,31,.8)}60%{box-shadow:0 5px 0 var(--ink),0 0 0 18px rgba(255,138,31,0)}}
.mpin svg.miga{width:100%!important;height:auto!important;display:block;margin:0!important;position:static!important}
.mpin{position:absolute;transform:translate(-50%,-100%);width:70px;pointer-events:none;z-index:2;animation:mbob 1.4s ease-in-out infinite}
@keyframes mbob{0%,100%{margin-top:0}50%{margin-top:-8px}}
.mprac{position:absolute;left:14px;bottom:16px;z-index:3;font-size:18px;padding:10px 18px}.mprac .badge{position:absolute;top:-9px;right:-8px;background:var(--bad);color:#fff;border:2px solid var(--ink);border-radius:10px;font-size:12px;padding:0 6px}
.msheet{position:absolute;left:0;right:0;bottom:0;z-index:4;background:var(--paper);color:var(--ink);border-top:4px solid var(--ink);border-radius:22px 22px 0 0;padding:16px 16px 20px;display:flex;flex-direction:column;gap:10px;box-shadow:0 -6px 0 rgba(20,33,61,.25);animation:mup .22s ease-out;max-width:480px;margin:0 auto}
@keyframes mup{from{transform:translateY(100%)}to{transform:none}}
.msheet .mh{display:flex;align-items:center;gap:10px}.msheet .mh h3{margin:0;font-family:var(--display);font-size:26px;flex:1}
.msheet .mrow2{display:flex;flex-wrap:wrap;gap:6px}.msheet .foe{display:flex;align-items:center;gap:8px;font-weight:700}.msheet .foe i{width:14px;height:14px;border-radius:50%;border:2px solid var(--ink);flex:none}
body.rm .mnd,body.rm .mpin{animation:none}
.links{display:flex;justify-content:center;gap:18px;flex-wrap:wrap}
.stars{display:flex;justify-content:center;gap:4px;font-size:28px;line-height:1}.stars span{color:#d3ddf0;-webkit-text-stroke:1.5px var(--ink)}.stars span.on{color:var(--gold)}
.ctr{text-align:center}
.cmp{font-family:var(--display);font-size:17px;text-align:center;padding:8px;border-radius:12px;border:3px solid var(--ink)}.cmp.win{background:#c9f7dc}.cmp.lose{background:#ffd3d8}
.unlock{font-weight:900;text-align:center;background:#fff2c2;border:2px solid var(--gold);border-radius:12px;padding:6px}
.rev .tag{display:inline-block;font-family:var(--display);font-size:11px;padding:1px 7px;border-radius:7px;background:var(--line);margin-right:6px}.rev .tag.sure{background:var(--bad);color:#fff}
.rev .rw{font-size:12.5px;color:var(--muted);margin-top:3px;white-space:normal}.rev .rw i{font-style:normal;opacity:.8}
.mast{display:flex;flex-direction:column;gap:6px}
.mrow{display:grid;grid-template-columns:92px 1fr 84px;gap:8px;align-items:center;font-weight:900;font-size:13px}
.mbar{height:10px;border-radius:6px;background:var(--mist);border:2px solid var(--line);overflow:hidden}.mbar b{display:block;height:100%}
.mrow small{color:var(--muted);font-weight:800;text-align:right;font-variant-numeric:tabular-nums;font-size:12px}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mode{text-align:left;background:var(--mist);border:3px solid var(--ink);border-radius:14px;padding:8px 10px;cursor:pointer;box-shadow:0 3px 0 var(--ink);color:var(--ink);display:flex;flex-direction:column;gap:2px;min-width:0;font-family:var(--body)}
.mode b{font-family:var(--display);font-weight:400;font-size:15px}.mode small{font-weight:800;font-size:12px;color:var(--muted)}
.mode:focus-visible,.node:focus-visible,.pick:focus-visible{outline:3px solid var(--saffron);outline-offset:2px}
.path{display:flex;flex-direction:column;align-items:center;gap:8px;padding:8px 0;background:linear-gradient(var(--line),var(--line)) center/4px 100% no-repeat}
.node{width:156px;display:flex;flex-direction:column;align-items:center;gap:2px;background:#fff;border:3px solid var(--ink);border-radius:16px;padding:6px;cursor:pointer;box-shadow:0 4px 0 var(--ink);color:var(--ink);font-family:var(--body)}
.node:nth-child(odd){transform:translateX(-40px)}.node:nth-child(even){transform:translateX(40px)}
.node b{font-family:var(--display);font-weight:400;font-size:20px}.node small{font-size:11px;font-weight:800;color:var(--muted)}.node .stars{font-size:16px}
.node.cur{background:#fff2c2;animation:pulse 1.4s ease-in-out infinite}.node.lock{background:#e6ebf5;color:#8a96ad;cursor:default;box-shadow:none}
@keyframes pulse{0%,100%{box-shadow:0 4px 0 var(--ink),0 0 0 0 rgba(255,210,63,.8)}50%{box-shadow:0 4px 0 var(--ink),0 0 0 10px rgba(255,210,63,0)}}
.mis{display:grid;grid-template-columns:1fr auto;gap:6px 10px;align-items:center;background:var(--mist);border-radius:14px;padding:10px}
.mis b{font-weight:900;font-size:14px}.mis .pbar{grid-column:1/-1;height:10px;border-radius:6px;background:#fff;border:2px solid var(--line);overflow:hidden}.mis .pbar i{display:block;height:100%;background:var(--saffron)}
.mis.done .pbar i{background:var(--good)}.mis .btn{font-size:14px;padding:4px 10px;border-width:3px;box-shadow:0 3px 0 var(--ink)}
.sty{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pick{border:3px solid var(--ink);border-radius:14px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;background:#fff;font-weight:900;font-size:12.5px;color:var(--ink);font-family:var(--body);min-width:0}
.pick small{font-weight:800;color:var(--muted);font-size:11px}
.pick .dots2{display:flex;gap:2px}.pick .dots2 i{width:14px;height:14px;border-radius:50%;border:2px solid var(--ink)}
.pick .trk{width:100%;height:34px;border-radius:8px;border:2px solid var(--ink)}
.pick.sel{outline:4px solid var(--blue);outline-offset:1px}.pick.locked{opacity:.5;cursor:default}
.set{display:flex;flex-direction:column}
.setline{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 2px;border-bottom:2px solid var(--mist);font-weight:900;color:var(--ink)}
.setline small{display:block;font-weight:700;color:var(--muted);font-size:12px}
.setline input[type=checkbox]{width:22px;height:22px;flex:none;accent-color:var(--blue)}
.setline select{font:inherit;font-weight:800;padding:4px 8px;border-radius:8px;border:2px solid var(--ink);background:#fff;color:var(--ink)}
.cons{display:flex;flex-direction:column}
.cons label{display:flex;gap:10px;align-items:flex-start;font-weight:800;font-size:14px;line-height:1.35;padding:6px 0;color:var(--ink)}
.cons input{width:22px;height:22px;flex:none;accent-color:var(--blue);margin:0}
.codebox{font-family:var(--display);font-size:28px;letter-spacing:.06em;text-align:center;background:var(--mist);border:3px dashed var(--ink);border-radius:14px;padding:10px;user-select:all;-webkit-user-select:all;overflow-wrap:anywhere}
.inp{box-sizing:border-box;font-family:var(--display);font-size:22px;text-transform:uppercase;padding:10px;border:3px solid var(--ink);border-radius:12px;width:100%;text-align:center;color:var(--ink);background:#fff}
.err{color:#c0283a;font-weight:900;font-size:13px;min-height:16px;text-align:center}
.adbar{height:12px;border-radius:6px;background:var(--mist);border:2px solid var(--line);overflow:hidden}.adbar i{display:block;height:100%;width:0;background:var(--blue);animation:adfill 2s linear forwards}@keyframes adfill{to{width:100%}}
.pro{font-family:var(--display);font-size:12px;background:linear-gradient(#ffe066,#f2a900);border:2px solid var(--ink);border-radius:8px;padding:1px 7px;color:var(--ink)}
.rm .miga,.rm .rays,.rm .packbox,.rm .btn.gold,.rm .node.cur,.rm .q{animation:none!important}
/* league */
.lg{display:flex;flex-direction:column;gap:4px;margin:0;padding:0;list-style:none;counter-reset:r}
.lg li{display:grid;grid-template-columns:28px 1fr auto;gap:8px;align-items:center;padding:6px 10px;border-radius:10px;background:var(--mist);font-weight:800;font-size:14px;font-variant-numeric:tabular-nums}
.lg li span:first-child{font-family:var(--display);color:var(--muted)}
.lg li small{color:var(--muted);font-weight:800;font-size:12px}
.lg li.me{background:#fff2c2;border:2px solid var(--gold)}
.taunt{font-weight:800;font-size:14px;background:var(--mist);border-radius:12px;padding:8px 10px}
.shareimg{width:100%;border-radius:14px;border:3px solid var(--ink);display:block}
.note{font-size:12px;color:var(--muted);font-weight:800}

/* v2b: road choice */
.opt.road span{font-family:var(--display);font-size:clamp(14px,4.6vw,20px);word-break:normal;overflow-wrap:normal;hyphens:none;line-height:1.15}.opt.road span small{display:block;font-size:12px;opacity:.7}.opt{cursor:pointer}
/* v2: combo meter, hit flash, coin rain, near miss */
.combo{display:flex;align-items:center;gap:6px;background:linear-gradient(180deg,#ffe066,#ffb800);border:2px solid var(--ink);border-radius:12px;padding:2px 8px 2px 8px;box-shadow:0 3px 0 var(--ink);font-family:var(--display);color:var(--ink);font-size:14px;transform-origin:left center}
.combo i{display:block;width:46px;height:7px;background:rgba(20,33,61,.25);border-radius:5px;overflow:hidden}.combo i b{display:block;height:100%;width:0;background:#fff;border-radius:5px;transition:width .25s}
.combo.pop{animation:cpop .35s ease-out}@keyframes cpop{0%{transform:scale(1.45)}100%{transform:scale(1)}}
.flash{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .25s;z-index:4}
.flash.bad{background:radial-gradient(ellipse at center,rgba(255,40,60,0) 40%,rgba(255,40,60,.55) 100%);opacity:1;transition:none}
.flash.good{background:radial-gradient(ellipse at center,rgba(60,230,140,0) 50%,rgba(60,230,140,.35) 100%);opacity:1;transition:none}
.coins{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:30}
.coins i{position:absolute;top:-40px;width:26px;height:26px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff6c2 0 18%,#ffd23f 30%,#f0a500 75%,#b87700 100%);border:2px solid #8a5a00;animation:rain linear forwards}
.coins i::after{content:'';position:absolute;inset:5px;border-radius:50%;border:2px solid rgba(138,90,0,.5)}
@keyframes rain{0%{transform:translateY(0) rotateY(0)}100%{transform:translateY(115vh) rotateY(1080deg)}}
.soclose{font-family:var(--display);font-size:46px;color:#ff8a1f;-webkit-text-stroke:2px var(--ink);margin:0;animation:cpop .5s ease-out}
.btn.retry{background:linear-gradient(180deg,#ff9f43,#ff6b1a);font-size:22px}
#qt{max-height:34vh;overflow-y:auto}#sheet .st b{white-space:nowrap}.ans,.opt span{word-break:normal;overflow-wrap:normal;hyphens:none}#sheet .sq{max-height:46vh;overflow-y:auto}

/* exam-paper question layout */
#qt,.sheet .sq{white-space:normal}
#qt{pointer-events:auto;touch-action:pan-y;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.qx-stem{display:block;white-space:pre-line}
#qt small+.qx-stem{margin-top:1px}
.qx-list~.qx-tail,.qx-match~.qx-tail{display:block;margin-top:7px;font-family:var(--body);font-size:14px;font-weight:800;line-height:1.3;color:#4a5875}
.qx-list{list-style:none;margin:7px 0 0;padding:0;display:grid;gap:5px}
.qx-list li{display:grid;grid-template-columns:auto 1fr;align-items:baseline;gap:8px;font-family:var(--body);font-weight:700;font-size:14.5px;line-height:1.38;color:#24314d;background:#f5f7fb;border-left:3px solid var(--omr);border-radius:4px 8px 8px 4px;padding:6px 9px;text-wrap:pretty}
.qx-list li b{font-weight:900;color:var(--omr);white-space:nowrap;font-size:13px;letter-spacing:.02em}
.qx-list li.ar,.qx-list li.stk{grid-template-columns:1fr;gap:1px}
.qx-list li.ar b,.qx-list li.stk b{font-size:11.5px;text-transform:uppercase;letter-spacing:.07em}
.qx-list.seq li{background:#fff;border:1.5px solid #dfe5f0;border-left:3px solid var(--blue)}.qx-list.seq li b{color:var(--blue)}
.qx-match{width:100%;border-collapse:separate;border-spacing:0;margin:7px 0 0;font-family:var(--body);font-size:13.5px;font-weight:700;line-height:1.32;color:#24314d;table-layout:fixed;border:1.5px solid #d7deeb;border-radius:8px;overflow:hidden}
.qx-match th{background:#eef2f9;font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;font-weight:900;text-align:left;padding:5px 8px;color:#14213d;border-bottom:1.5px solid #d7deeb}
.qx-match th em{display:block;font-style:normal;text-transform:none;letter-spacing:0;color:#5a6b8c;font-weight:700;font-size:12px}
.qx-match td{padding:6px 8px;vertical-align:top;border-top:1px solid #e6ebf3;overflow-wrap:break-word}
.qx-match tr:first-child td{border-top:0}
.qx-match td+td,.qx-match th+th{border-left:1.5px solid #d7deeb}
.qx-match td b{color:var(--omr);font-weight:900;margin-right:2px}
.fmtq .qx-stem{font-size:16.5px;line-height:1.25}
.big .qx-list li,.big .qx-match{font-size:16px}
.ans{display:flex;align-items:center;justify-content:center;gap:8px;text-align:left}
.ans .abub{flex:none;width:24px;height:24px;border-radius:50%;border:2px solid var(--ink);display:grid;place-items:center;font-size:13px;font-style:normal;background:#fff}
.sheet .sb .ans{white-space:normal;overflow-wrap:normal;word-break:normal}
.sheet .st span{font-size:11.5px;line-height:1.15;text-align:right;white-space:normal}

/* result v2 */
#rcard.r2card{background:#fff;border:0;border-radius:28px;box-shadow:0 20px 60px rgba(20,33,61,.18);padding:18px 20px 16px;max-height:calc(100dvh - 24px);overflow:hidden;position:relative}
.r2{display:flex;flex-direction:column;align-items:center;text-align:center}
.r2top{width:100%;display:flex;justify-content:space-between;align-items:center}
.r2chip{font:700 14px/1 var(--f,inherit);color:#b45309;background:#fff7ed;border:1px solid #fed7aa;border-radius:99px;padding:7px 12px}
.r2chip.up{background:#ffedd5}
.r2link{background:none;border:0;font:600 14px inherit;color:#64748b;padding:8px 4px;cursor:pointer}
.r2hero{height:128px;width:128px;border-radius:50%;display:flex;align-items:flex-end;justify-content:center;overflow:hidden;margin:6px 0 10px;background:radial-gradient(circle at 50% 40%,#ecfdf5,#d1fae5)}
.r2hero.lose{background:radial-gradient(circle at 50% 40%,#f8fafc,#e2e8f0)}
.r2hero .miga{width:104px!important;margin-bottom:-6px}
.r2eye{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#94a3b8;font-weight:700}
.r2h{font-size:40px;line-height:1.05;margin:6px 0 2px;color:#0f172a;letter-spacing:-.02em}
.r2sub{font-size:16px;color:#475569;font-weight:600;margin-bottom:2px}
.r2 .stars{margin:6px 0 0}
.r2stat{margin:12px 0 4px;background:#f8fafc;border:1px solid #e2e8f0;border-radius:99px;padding:10px 16px;font-size:15px;color:#475569;display:flex;gap:6px;align-items:center;cursor:pointer}
.r2stat b{color:#0f172a}.r2stat span{color:#cbd5e1}.r2stat i{font-style:normal;color:#2563eb;font-weight:600;margin-left:6px;font-size:13px}
.r2note{font-size:13px;color:#64748b;margin-top:6px}
.r2acts{width:100%;margin-top:18px;display:flex;flex-direction:column;align-items:center;gap:4px}
.r2main{width:100%;font-size:20px;padding:16px}
.r2sec{background:none;border:0;color:#b45309;font-weight:700;font-size:15px;padding:10px;cursor:pointer;text-decoration:underline;text-underline-offset:4px}
.r2dock{width:100%;display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:14px;padding-top:14px;border-top:1px solid #f1f5f9}

/* ===== Design system v3 (Duolingo-grade calm): one button, colours with jobs, white space =====
   green = go / correct, blue = info, gold = rewards, red = wrong. Everything else is white + grey. */
:root{
  --go:#58cc02; --go-d:#46a302; --info:#1cb0f6; --info-d:#1899d6; --rw:#ffc800; --rw-d:#e5a500; --no:#ff4b4b; --no-d:#ea2b2b;
  --sf:#ffffff; --sf2:#f7f7f7; --ln:#e5e5e5; --tx:#3c3c3c; --tx2:#777777;
}
.card{border:0;border-radius:24px;box-shadow:0 18px 50px rgba(0,0,0,.28);padding:20px 18px;gap:14px;color:var(--tx)}
.card h1,.ttl{color:var(--tx);text-shadow:none;letter-spacing:-.5px}
.btn{font-size:19px;letter-spacing:.3px;color:#fff;background:var(--go);border:0;border-radius:16px;padding:13px 12px;box-shadow:0 4px 0 var(--go-d);text-shadow:none;transition:filter .12s}
.btn:hover{filter:brightness(1.05)}
.btn:active{transform:translateY(4px);box-shadow:0 0 0 var(--go-d)}
.btn.blue{background:var(--info);box-shadow:0 4px 0 var(--info-d);font-size:17px}
.btn.alt,.btn.retry{background:var(--go);box-shadow:0 4px 0 var(--go-d)}
.btn.pink{background:var(--sf);color:var(--tx);box-shadow:0 0 0 2px var(--ln) inset,0 4px 0 var(--ln);font-size:17px}
.btn.gold{background:var(--rw);color:#4b3a00;box-shadow:0 4px 0 var(--rw-d);animation:none}
.btn.sm{font-size:16px;padding:9px;box-shadow:0 3px 0 rgba(0,0,0,.18)}
.btn.blue.sm{box-shadow:0 3px 0 var(--info-d)}.btn.gold.sm{box-shadow:0 3px 0 var(--rw-d)}
.btn.big{font-size:24px;padding:15px 12px}
.x{background:var(--sf);border:2px solid var(--ln);border-radius:12px;color:var(--tx2);font-size:15px;padding:6px 14px}
.chip{border:2px solid var(--ln);background:var(--sf);color:var(--tx)}
.chip.fire{background:#fff4e5;border-color:#ffd9a8;color:#c2410c}
.stage{border:0;border-radius:18px}
.bubble{border:2px solid var(--ln);box-shadow:none;color:var(--tx)}
.bubble.r:after{border-left-color:var(--ln)}.bubble.l:after{border-right-color:var(--ln)}
.note,.eyebrow,.sub{color:var(--tx2)}

/* home */
.card.home{gap:12px;padding:18px 16px 10px}
.hm-top{display:flex;align-items:center;gap:12px}
.hm-miga{flex:none;width:92px}.hm-miga .miga{width:92px}
.hm-hi{display:flex;flex-direction:column;gap:4px;min-width:0}
.hm-hi .mtop{justify-content:flex-start;min-height:0}
.hm-hi .ttl{font-size:34px;text-align:left;color:var(--tx)}
.hm-bub{margin:0;font-weight:800;font-size:14px;line-height:1.3;color:var(--tx2)}
.hm-sec{font-family:var(--display);font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--tx2);margin:2px 2px -4px}
.hm-list{display:flex;flex-direction:column;gap:8px}
.hm-row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--sf);border:2px solid var(--ln);border-radius:16px;padding:10px 12px;box-shadow:0 3px 0 var(--ln);cursor:pointer;color:var(--tx);font-family:var(--body)}
.hm-row:active{transform:translateY(3px);box-shadow:none}
.hm-row:focus-visible{outline:3px solid var(--info);outline-offset:2px}
.hm-ic{flex:none;width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-style:normal;font-size:20px;font-weight:900;color:#fff;background:#a0aec0}
.hm-ic svg{width:22px;height:22px}
.hm-ic.gold{background:var(--rw);color:#4b3a00}.hm-ic.blue{background:var(--info)}.hm-ic.green{background:var(--go)}
.hm-t{flex:1;min-width:0;display:flex;flex-direction:column}
.hm-t b{font-family:var(--display);font-weight:400;font-size:17px;line-height:1.15}
.hm-t small{font-weight:700;font-size:12.5px;color:var(--tx2);line-height:1.25}

.hm-row.live{border-color:var(--no)}.hm-row.live small{color:var(--no);font-weight:900}
.tabbar{display:grid;grid-template-columns:repeat(4,1fr);border-top:2px solid var(--ln);margin:4px -16px 0;padding:8px 6px 2px}

.tabbar .tile svg{width:28px;height:28px}
.tabbar .tile:active{transform:none}
#pcard .hm-list .hm-ic{background:#eef2f7;color:var(--tx)}

/* question card: calm, answers are the buttons */
.q{border:0;border-radius:18px;background:#fff;background-image:none;box-shadow:0 10px 28px rgba(0,0,0,.25);padding:0 0 12px;overflow:hidden}
.qh{background:none;color:var(--tx2);padding:10px 14px 0;font-size:12px}
.qh .tm{background:var(--ln)}.qh .tm b{background:var(--info)}
#qt{color:var(--tx);font-size:18px;padding:6px 14px 10px}
.opts{gap:8px;padding:0 12px}
.opt{border:2px solid var(--ln);border-radius:14px;padding:10px 10px;box-shadow:0 3px 0 var(--ln);font-size:16px;background:#fff;color:var(--tx)}
.opt .bub{border:2px solid var(--ln);color:var(--tx2);width:26px;height:26px;font-size:13px}
.opt.on{border-color:var(--info);background:#ddf4ff;box-shadow:0 3px 0 var(--info-d);transform:none}

.opt.fill .bub{background:var(--tx);border-color:var(--tx);color:#fff}
.opt.ok{border-color:var(--go);background:#d7ffb8;box-shadow:0 3px 0 var(--go-d)}
.opt.no{border-color:var(--no);background:#ffdfe0;box-shadow:0 3px 0 var(--no-d)}

.qbtns{justify-content:flex-end;margin:6px 12px 0}
.lock.skip{background:none;border:0;box-shadow:none;color:var(--tx2);font-family:var(--display);font-size:14px;letter-spacing:.06em;padding:4px 6px;text-shadow:none}
.stamp{border-width:2px;background:#fff}

/* HUD: lighter chrome */
.lvl{background:var(--sf);color:var(--tx);border:0;text-shadow:none;box-shadow:0 3px 0 rgba(0,0,0,.18);font-size:16px;padding:4px 12px}
.bar{background:rgba(0,0,0,.25);border:0;height:12px}.bar i{background:var(--rw)}
.marks{background:var(--sf);color:var(--tx);border:0;box-shadow:0 3px 0 rgba(0,0,0,.18);font-size:16px}
.need{border:0;box-shadow:0 3px 0 rgba(0,0,0,.18);font-size:13px}
body{background:#0f1c33}
.sheet{border:0;border-radius:22px;box-shadow:0 14px 40px rgba(0,0,0,.3)}
.ans{border:2px solid var(--ln);box-shadow:0 3px 0 var(--ln);font-family:var(--body);font-weight:900;color:var(--tx);background:#fff}
.ans.ok{border-color:var(--go);background:#d7ffb8}.ans.no{border-color:var(--no);background:#ffdfe0}
.stats div,.mis,.brow,.mode,.bld{border:0;background:var(--sf2)}
.mode,.pick,.settile,.node{border:2px solid var(--ln);box-shadow:0 3px 0 var(--ln)}
.banner{text-shadow:0 3px 12px rgba(0,0,0,.35)}
.mbar2{border-bottom:0;box-shadow:0 2px 12px rgba(0,0,0,.12)}
.mnd{border:0;box-shadow:0 5px 0 rgba(0,0,0,.2)}
.tile .badge,.mprac .badge{border:0}
@media (min-width:700px){#wrap{max-width:440px;margin:18px auto;height:calc(100% - 36px);border-radius:28px;box-shadow:0 30px 80px rgba(0,0,0,.45)}}

        dmgNum(m.x,m.kind==='min'?1:1.6,m.z,'1',m.kind==='min'?'#ffffff':'#ffd23f');if(m.hp<=0){killMon(m);break}}}
